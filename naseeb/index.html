V.delivery = C => { const T = C.T;
  const F = { open: o => !o.settled, courier: o => o.deliveryStatus === 'بعهدة الدليفري' && !o.settled, unpaid: o => (o.deliveryStatus === 'وصلت' || o.deliveryStatus === 'مرتجعة') && !o.settled, paid: o => !!o.settled, all: o => true };
  const L = [['open','لسا ما انقبضت'],['courier','مع الدليفري'],['unpaid','وصلت وما انقبضت'],['paid','انقبضت'],['all','الكل']];
  const f = F[UI.dfilter] ? UI.dfilter : 'open';
  const rows = C.dOrders.filter(F[f]).slice().reverse();
  const stNo = {}; C.dpay.forEach(p => stNo[p.id] = p.no);
  const settledCell = o => o.settled === 'stmt' ? `<span class="st t-good">كشف #${stNo[o.stmt]}</span>` : o.settled === 'pool' ? '<span class="st t-good">دفعة عامة</span>' : o.settled === 'zero' ? '<span class="dim">ما في مبلغ</span>' : (o.deliveryStatus === 'وصلت' || o.deliveryStatus === 'مرتجعة') ? '<span class="st t-warn">بانتظار الكشف</span>' : '<span class="dim">—</span>';
  const bar = `<div class="chips">${L.map(([k,l]) => `<button class="chip${f === k ? ' on' : ''}" data-act="dfilter" data-v="${k}">${l}<i>${C.dOrders.filter(F[k]).length}</i></button>`).join('')}</div>`;
  const diffCell = p => p.orders == null ? '<td class="m dim">—</td>' : Math.abs(p.diff) < 0.01 ? '<td class="m"><span class="tag t-good" dir="rtl">مطابق</span></td>' : `<td class="m ${p.diff < 0 ? 'neg' : 'pos'}">${p.diff > 0 ? '+' : ''}${money(p.diff)}</td>`;
  return ph('الدليفري', 'بالطلبيات بتحط «بعهدة الدليفري» بس. «وصلت» و«رجعت» بتتسجّل من كشف الحساب هون — هيك كل طلبية بتتسكّر مرة وحدة، والمصاري بتنحسب مرة وحدة لما تقبضها. رسوم التوصيل بيدفعها الزبون فوق الفاتورة وبياخدها الدليفري.', readOnly ? '' : `<button class="btn pri" data-act="stmt">${ico('plus')}كشف حساب جديد</button>`) +
  `<div class="grid g4">
    <section class="card kpi"><span class="lbl">مع الدليفري هلّق</span><span class="val">${money(T.dPendingCourier)}</span><div class="foot"><span>${T.dWithCount} طلبية بالطريق</span></div></section>
    <section class="card kpi"><span class="lbl">إلك عند الدليفري</span><span class="val" style="color:${T.dBalance > 0.004 ? 'var(--warn)' : 'var(--good)'}">${money(Math.max(0, T.dBalance))}</span><div class="foot"><span>${T.dUnsettledCount ? T.dUnsettledCount + ' طلبية وصلت وما انقبضت' : T.dBalance > 0.004 ? 'فرق من الكشوفات' : 'مسدّد كل يلي عليه'}</span></div></section>
    <section class="card kpi"><span class="lbl">انقبض لهلّق</span><span class="val">${money(T.dPaid)}</span><div class="foot"><span>${C.dpay.length} كشف${T.dComm ? ' · خصومات ' + money(T.dComm) : ''}</span></div></section>
    <section class="card kpi"><span class="lbl">رسوم توصيل دفعها الزبائن</span><span class="val">${money(T.dFees)}</span><div class="foot"><span>للدليفري — مش إلك ولا عليك</span></div></section>
  </div>` +
  tcard('dorders', bar, table('dorders', [
    { h:'#', v: o => `<b>#${o.no}</b>` }, { h:'الزبون', v: o => `<b style="font-weight:500">${esc(o.customer)}</b>` }, { h:'المنطقة', v: o => esc(o.area) || '<span class="dim">—</span>' }, { h:'الأسبوع', v: o => esc(o.weekEnd) },
    { h:'الحالة', v: o => pill(o.deliveryStatus || 'لسا ما تحددت') },
    { h:'إلك منها', m:1, cell: o => mcell(o.owes, 'strong') }, { h:'التوصيل', m:1, cell: o => mcell(o.deliveryFee || null) }, { h:'الزبون بيدفع', m:1, cell: o => mcell(o.custPays) },
    { h:'القبض', v: settledCell },
  ], rows, { act:'edit-orders', idOf: o => o.key, icon:'delivery', emptyT: C.dOrders.length ? 'ما في طلبيات بهالفلتر' : 'ما في طلبيات دليفري', empty: C.dOrders.length ? '' : 'اختار «دليفري» كطريقة تسليم بالطلبيات.' }), rows.length + ' طلبية') +
  tcard('dpay', '<b style="font-size:14px">كشوفات الحساب</b>', table('dpay', [
    { h:'#', v: p => `<span class="code">K-${String(p.no).padStart(2,'0')}</span>` }, { h:'التاريخ', v: p => esc(p.date) }, { h:'الطلبيات', v: p => p.orders ? p.count : '<span class="dim">دفعة عامة</span>' },
    { h:'المتوقع', m:1, cell: p => mcell(p.orders ? p.expectedNow : null) }, { h:'المستلم', m:1, cell: p => mcell(p.amount, 'strong') }, { h:'خصومات', m:1, cell: p => mcell(p.commission || null) },
    { h:'الفرق', m:1, cell: diffCell }, { h:'ملاحظات', v: p => esc(p.notes) },
  ], C.dpay.slice().reverse(), { act:'edit-dpay', icon:'cash', emptyT:'ما في كشوفات لهلق', empty:'أول ما يوصلك كشف من الدليفري، سجّلو من «كشف حساب جديد».' }), C.dpay.length + ' كشف');
};

/* courier statement (كشف حساب): pick the orders it covers, compare expected vs received */
function openStatement(id) {
  if (readOnly) { toast('عندك صلاحية قراءة بس'); return; }
  const C = CUR; const rec = id ? (S.dpay[id] || {}) : {};
  const inSt = new Set(Array.isArray(rec.orders) ? rec.orders : []);
  const cands = C.dOrders.filter(o => inSt.has(o.key) || (!o.settled && o.deliveryStatus !== 'مرتجعة' && o.deliveryStatus !== 'ملغاة'));
  const initSel = o => inSt.has(o.key) ? (o.deliveryStatus === 'مرتجعة' ? 'مرتجعة' : 'وصلت') : '';
  const stLbl = o => o.deliveryStatus || 'بلا حالة';
  const rowsH = cands.map(o => `<div class="srow" data-key="${esc(o.key)}">
      <div class="t"><b>#${o.no} · ${esc(o.customer)}</b><small>${esc(o.area || '—')} · أسبوع ${esc(o.weekEnd)} · ${o.qty} قطعة · ${esc(stLbl(o))}</small></div>
      <div class="amt"><b>${money(o.owes)}</b><small>الزبون بيدفع ${money(o.custPays)}</small></div>
      <select class="cell-sel" aria-label="وضع الطلبية بالكشف"><option value="">مش بالكشف</option><option value="وصلت"${initSel(o) === 'وصلت' ? ' selected' : ''}>وصلت ✓</option><option value="مرتجعة"${initSel(o) === 'مرتجعة' ? ' selected' : ''}>رجعت</option></select>
    </div>`).join('');
  const d = $('#drawer');
  d.innerHTML = `<div class="scrim" data-x="close"></div><form class="panel" id="sfrm" novalidate role="dialog" aria-modal="true" aria-label="كشف حساب">
    <header><div><h2>${id ? 'تعديل كشف حساب' : 'كشف حساب جديد'}</h2><div class="sub">علّم الطلبيات يلي بالكشف — المتوقع بيتحسب لحالو</div></div><button type="button" class="btn icon ghost" data-x="close" aria-label="إغلاق">${ico('x')}</button></header>
    <div class="pbody"><div class="fgrid">
      <div class="fld"><label for="k_date">تاريخ الكشف</label><input id="k_date" type="date" value="${esc(rec.date || today())}"></div>
      <div class="fld" style="justify-content:flex-end"><button type="button" class="btn" data-x="all">${ico('check')}كلها وصلت</button></div>
      <div class="fsec">الطلبيات (${cands.length})</div>
      <div class="fld full"><div class="slist">${rowsH || '<div class="allgood">ما في طلبيات دليفري بانتظار الكشف</div>'}</div></div>
      <div class="fsec">المبلغ</div>
      <div class="fld"><label for="k_amount">المبلغ يلي قبضتو ($)</label><input id="k_amount" type="number" step="any" inputmode="decimal" dir="ltr" style="text-align:right" value="${esc(rec.amount ?? '')}"><span class="hint">فاضي = نفس المتوقع</span></div>
      <div class="fld"><label for="k_comm">خصومات الدليفري ($)</label><input id="k_comm" type="number" step="any" inputmode="decimal" dir="ltr" style="text-align:right" value="${esc(rec.commission ?? '')}"><span class="hint">مثلاً رسوم مشوار طلبية رجعت — عادةً فاضي</span></div>
      <div class="fld full"><label for="k_notes">ملاحظات</label><input id="k_notes" type="text" value="${esc(rec.notes || '')}"></div>
      <div class="calc" id="kcalc"></div>
    </div></div>
    <div class="err" id="kerr"></div>
    <footer><div>${id ? '<button type="button" class="btn danger" data-x="del">حذف الكشف</button>' : ''}</div><div class="r"><button type="button" class="btn" data-x="close">إلغاء</button><button type="submit" class="btn pri">${ico('check')}حفظ الكشف</button></div></footer></form>`;
  d.hidden = false;
  const frm = $('#sfrm');
  const sel = () => [...frm.querySelectorAll('.srow')].map(r => ({ key: r.dataset.key, v: r.querySelector('select').value }));
  const byKey = k => C.orderByKey[k];
  const expected = () => r2(sel().filter(x => x.v === 'وصلت').reduce((a,x) => a + (byKey(x.key)?.owes || 0), 0));
  const refresh = () => {
    const ex = expected(), picked = sel().filter(x => x.v).length;
    const amtRaw = $('#k_amount').value.trim(), amt = amtRaw === '' ? ex : n(amtRaw), comm = n($('#k_comm').value);
    const diff = r2(amt + comm - ex);
    frm.querySelectorAll('.srow').forEach(r => r.classList.toggle('on', !!r.querySelector('select').value));
    $('#kcalc').innerHTML = `<div>طلبيات بالكشف<b>${picked}</b></div><div>المتوقع تقبضو<b>${money(ex)}</b></div><div>المستلم<b>${money(amt)}</b></div>`
      + `<div class="warnline" style="color:${Math.abs(diff) < 0.01 ? 'var(--good)' : diff < 0 ? 'var(--bad)' : 'var(--warn)'}">${Math.abs(diff) < 0.01 ? 'مطابق ✓' : diff < 0 ? 'ناقص ' + money(-diff) + ' — الدليفري لسا عليه هالمبلغ' : 'زيادة ' + money(diff) + ' عن المتوقع — راجع الكشف'}</div>`;
  };
  frm.addEventListener('input', refresh); frm.addEventListener('change', refresh); refresh();
  d.addEventListener('click', async e => {
    const x = e.target.closest('[data-x]'); if (!x) return;
    if (x.dataset.x === 'close') closeDrawer();
    if (x.dataset.x === 'all') { frm.querySelectorAll('.srow select').forEach(s => { if (s.value !== 'مرتجعة') s.value = 'وصلت'; }); refresh(); }
    if (x.dataset.x === 'del') {
      if (!x.classList.contains('armed')) { x.classList.add('armed'); x.textContent = 'اضغط مرة تانية للتأكيد'; return; }
      closeDrawer();
      for (const k of inSt) { const cur = S.orders[k]; if (cur && cur.stmt === id) await put('orders', k, { ...cur, stmt: '' }); }
      await del('dpay', id); toast('انحذف الكشف — الطلبيات رجعت «بانتظار الكشف»');
    }
  });
  frm.addEventListener('submit', async e => {
    e.preventDefault();
    const picks = sel().filter(x => x.v); const ex = expected();
    const amtRaw = $('#k_amount').value.trim(); const amt = amtRaw === '' ? ex : n(amtRaw);
    if (!picks.length && !amt) { $('#kerr').textContent = 'علّم طلبية وحدة عالأقل أو اكتب المبلغ'; return; }
    const date = $('#k_date').value || today(), comm = $('#k_comm').value.trim(), notes = $('#k_notes').value.trim();
    const sid = id || newId();
    closeDrawer();
    await put('dpay', sid, { date, amount: String(r2(amt)), commission: comm, notes, orders: picks.map(x => x.key), expected: String(ex) });
    const EMPTY = { deliveryMethod:'دليفري', area:'', payStatus:'', collected:'', deliveryDate:'', deliveryStatus:'', deposit:'', depositMethod:'', deliveryFee:'' };
    for (const x of picks) { const cur = S.orders[x.key] || EMPTY;
      await put('orders', x.key, { ...cur, deliveryStatus: x.v, deliveryDate: cur.deliveryDate || date, stmt: sid, payStatus: x.v === 'وصلت' ? 'مدفوع بالكامل' : cur.payStatus || '' }); }
    for (const k of inSt) if (!picks.some(x => x.key === k)) { const cur = S.orders[k]; if (cur && cur.stmt === sid) await put('orders', k, { ...cur, stmt: '' }); }
    toast(id ? 'انحفظ الكشف' : 'انسجّل الكشف — ' + picks.length + ' طلبية');
  });
}

V.cash = C => { const T = C.T; const pn = p => settings['p' + p] || (p === '0' ? 'الشريك الأول' : 'الشريك الثاني');

  `<div class="grid g3">

    ${C.partners.map(p => `<section class="card kpi"><span class="lbl">${esc(p.name)} · ${pct(p.share)}</span><span class="val">${money(p.left)}</span><div class="foot"><span>متبقي له${p.owedExp ? ' · منها مصاريف ' + money(p.owedExp) : ''} · سحب ${money(p.took)}</span></div></section>`).join('')}

  ${tcard('expenses', '<b style="font-size:14px">المصاريف العامة</b>', table('expenses', [{ h:'التاريخ', v: x => esc(x.date) }, { h:'البيان', v: x => esc(x.desc) }, { h:'الفئة', v: x => esc(x.category) }, { h:'المبلغ', m:1, cell: x => mcell(x.amount, 'strong') }, { h:'دفعها مين', v: x => x.payer ? `<span class="tag t-warn">${esc(pn(x.payer))} · من جيبو</span>` : 'الصندوق' }, { h:'ملاحظات', v: x => esc(x.notes) }], C.expenses.slice().reverse(), { act:'edit-expenses', icon:'moneyout', emptyT:'ما في مصاريف لهلق', emptyBtn: addBtn('expenses','مصروف', false), foot: C.expenses.length ? `<td colspan="3">المجموع</td>${mcell(T.expTotal)}<td colspan="2"></td>` : '' }))}
  <section class="card"><div class="card-h"><h2>صافي مساهمة ونصيب كل شريك</h2></div><div style="padding-top:12px">${partnersTable(C, true)}</div><div class="card-b" style="padding-top:10px;color:var(--muted);font-size:12.5px">صافي الربح = المبيعات − كلفة القطع المباعة − كل المصاريف (${money(C.T.grossProfit)} − ${money(C.T.expTotal)} = ${money(C.T.profit)}). الحصة = صافي الربح × النسبة. المصاريف يلي دفعها شريك من جيبو بترجعلو كاملة قبل التوزيع — لما ترجّعلو ياها سجّل «استرداد مصاريف». البضاعة يلي جابها شريك بتنحسب رأس مال إلو.</div></section>`;
};

  <section class="card"><div class="card-h"><h2>طريقة الشغل لكل كرتونة</h2></div><div class="card-b"><ol class="steps">
    <li><span><b>سجّل الكرتونة</b> فور الشراء — بالوزن (الوزن × سعر الكيلو) أو بالقطعة (العدد × سعر القطعة) + أي مصاريف إضافية.</span></li>
    <li><span><b>افرز القطع</b>: التالف أولًا بحالة «تالفة»، بعدين الجيد — سطر لكل قطعة أو مجموعة متطابقة مع الكمية وحالتها. بعدين قول لـClaude «سعّر القطع الناقصة» ليجيب أعلى سعر أونلاين ويحدد الطلب عليها — والسعر المقترح بيطلع لحالو.</span></li>
    <li><span><b>سجّل كل عملية بيع</b> يوم بيومه. الطلبية الأسبوعية (زبون + أسبوع بينتهي السبت) بتنعمل لحالها.</span></li>
    <li><span><b>حدّث الطلبيات</b>: سلّمتها للدليفري؟ «بعهدة الدليفري». الزبون لغى قبل الشحن؟ «ملغاة» — والقطع بترجع عالمخزون فورًا. «وصلت» و«رجعت» لطلبيات الدليفري بتتسجّل من كشف الحساب بس. لإلغاء قطعة وحدة من طلبية، افتح عملية البيع واختار «ملغاة».</span></li>
    <li><span><b>سجّل دفعات الدليفري</b> مع العمولة، والرصيد عنده بيتحسب لحاله.</span></li>
    <li><span><b>الصندوق</b>: إيداعات وسحوبات الشركاء والمصاريف — ولوحة التحكم بتجمع كل شي.</span></li>
  </ol></div></section>`;

// Re-sort every uploaded photo of this carton's waiting cards into products, then let Claude read each one.
// Photos are reused (no re-upload); only the cards are rebuilt.
async function nxRegroup() {
  await nxInit();
  const old = nxMine().filter(d => nxSt(d) !== 'up' && (d.imgs || []).length);
  const ids = old.flatMap(d => d.imgs || []);
  if (!ids.length) { toast('ما في صور مرفوعة لهالكرتونة'); return; }
  NX.stop = false; NX.err = ''; NX.busy = 'group'; nxAwake(true); nxSetProg(0, `عم جهّز ${ids.length} صورة…`); render();
  const photos = []; let k = 0;
  await nxPool(ids, 4, async (a, i) => {
    let blob = NX.localBlob[a] || null;
    if (!blob) { try { const r = await fetch(NB_BLOB + a); if (r.ok) blob = await r.blob(); } catch (e) {} }
    const thumb = blob ? await nxShrink(blob, 256, 0.72) : null;
    photos[i] = thumb ? { a, thumb, t: 0, file: { name: '' }, url: NX.thumbOf[a] || NB_BLOB + a } : null;
    k++; nxSetProg(k / ids.length * 0.3, `عم جهّز الصور… ${k} من ${ids.length}`);
  });
  const ph = photos.filter(Boolean);
  if (!ph.length) { NX.busy = ''; NX.err = 'ما قدرت جيب الصور — جرّب كمان مرة'; nxAwake(false); render(); return; }
  const groups = await nxGroup(ph, false);
  if (!nxCanSee()) { NX.busy = ''; nxAwake(false); render(); return; }   // Claude couldn't look: keep the cards as they were
  const base = Math.max(0, ...old.map(d => d.seq || 0));
  for (const d of old) { delete NX.drafts[d.id]; delete NX.dirty[d.id]; if (db && mode === 'db' && !demo) { try { await db.doc('intake/' + d.id).delete(); } catch (e) {} } }
  for (const [g, grp] of groups.entries()) {
    const imgs = grp.map(i => ph[i].a).slice(0, NX_MAXPH);
    const id = 'd' + newId().replace('-', '');
    const nd = { id, cartonId: NX.cartonId, seq: base + g + 1, st: 'wait', imgs, n: imgs.length, qty: '1', grade: 'A', demand: 'عادي', name: '', category: '', storeCat: 'home', marketPrice: '', priceNote: '', brand: '', ian: '', desc: '', f1: '', n1: '', f2: '', n2: '', f3: '', channel: 'مزاد تنافسي', store: false, at: Date.now() };
    await nxSaveDraft(nd, {}); NX.queue.push(id);
  }
  NX.busy = ''; toast(`صاروا ${groups.length} قطعة — Claude عم يقرا كل وحدة`); render(); nxRun();
}
function nxAuto(d) { if (!d.channelSet) d.channel = n(d.qty) >= 3 ? 'كمية ثابتة' : 'مزاد تنافسي'; if (!d.storeSet) d.store = d.channel === 'كمية ثابتة' || d.demand === 'بطيء'; }

/* ---------- save everything to the ledger ---------- */
async function nxPutMany(coll, entries) {        // many records -> one merge-write per bucket (≤60 records per write)
  const next = { ...S[coll] }; entries.forEach(([id, r]) => { next[id] = r; }); S[coll] = next; render();
  if (demo) return; if (mode !== 'db') { saveLocal(); return; }
  const byB = {}; entries.forEach(([id, r]) => { (byB[coll + '/b' + bucket(id)] ||= []).push([id, r]); });
  for (const [path, list] of Object.entries(byB)) for (let i = 0; i < list.length; i += 60) {
    const part = Object.fromEntries(list.slice(i, i + 60));
    await enqueue(path, async () => { const ref = db.doc(path);
      try { await ref.update({ r: part }); }
      catch (e) { if (e && e.code === 'invalid_argument') { const sn = await ref.get().catch(() => null); if (sn && sn.exists) throw e; await ref.set({ r: part }); } else throw e; } }).catch(fail);
  }
}
const nxDayId = () => { const d = new Date(); return 'n' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3); };
async function nxItemx(id) {                     // description, features and photo ids of an item (kept out of the month bucket)
  if (NX.itemx[id]) return NX.itemx[id];
  if (db && mode === 'db' && !demo) { try { const s = await db.doc('itemx/' + id).get(); if (s.exists) return (NX.itemx[id] = s.data() || {}); } catch (e) {} }

}
async function nxSetItemx(id, x) { NX.itemx[id] = x; if (db && mode === 'db' && !demo) { try { await db.doc('itemx/' + id).set(x); } catch (e) { toast('ما انحفظ الوصف — جرّب كمان مرة'); } } }

async function nxSaveAll() {
  if (NX.saving) return;
  if (!NX.cartonId || !S.cartons[NX.cartonId]) { toast('اختار الكرتونة أول'); return; }
  const ready = nxMine().filter(d => (d.name || '').trim() && n(d.qty) > 0 && ['ready', 'manual', 'fail'].includes(nxSt(d)) && (d.imgs || []).length);
  if (!ready.length) { toast('ما في قطع جاهزة — كل قطعة بدها اسم وعدد وصور مرفوعة'); return; }
  NX.saving = true; NX.busy = 'save'; NX.prog = 0; render();
  let code = nxNextCode();
  const recs = [], xs = [];
  ready.forEach(d => {
    const id = nxDayId(), imgs = (d.imgs || []).slice(0, 4);
    const feats = [[d.f1, d.n1], [d.f2, d.n2], [d.f3, '']].filter(x => (x[0] || '').trim()).map(([t, nn]) => (nn || '').trim() ? { t: t.trim(), n: nn.trim() } : { t: t.trim() });
    recs.push([id, { code: 'P-' + nxPad(code), lot: code, cartonId: d.cartonId, name: d.name.trim(), category: (d.category || '').trim(), grade: d.grade || 'A', demand: d.demand || 'عادي',
      qty: String(n(d.qty)), channel: d.channel || 'مزاد تنافسي', sortStatus: 'متاحة', marketPrice: d.marketPrice ? String(n(d.marketPrice)) : '',
      priceSrc: d.marketPrice ? 'تقدير Claude' : '', storeCat: d.storeCat || 'home', store: d.store ? '1' : '', img0: imgs[0] || '' }]);
    xs.push([id, { desc: (d.desc || '').trim(), features: feats, imgs, brand: d.brand || '', ian: d.ian || '', priceNote: d.priceNote || '', hook: d.hook || '', pitch: d.pitch || '', use: d.use || '', ...(d.noBat ? { noBat: 1 } : {}), ...(d.ean ? { ean: d.ean, eanTried: 1 } : {}) }, d]);
    code++;
  });
  nxSetProg(0.05, `عم سجّل ${recs.length} قطعة بالدفتر…`);
  await nxPutMany('items', recs);
  let done = 0;
  await nxPool(xs, 4, async ([id, x, d]) => {
    await nxSetItemx(id, x);
    const extra = (d.imgs || []).slice(4).filter(a => !/^local-/.test(a));
    if (nxAssets) for (const a of extra) { try { await nxAssets.delete(a); } catch (e) {} }
    await nxDropDraft(d, false);
    done++; if (done % 5 === 0 || done === xs.length) nxSetProg(0.1 + 0.9 * done / xs.length, `عم احفظ الوصف والصور… ${done} من ${xs.length}`);
  });
  const c = S.cartons[NX.cartonId];
  if (c && (c.status === 'جديدة' || !c.status)) await put('cartons', NX.cartonId, { ...c, status: 'قيد الفرز' });
  NX.saving = false; NX.busy = ''; NX.studioCarton = NX.cartonId; nxUsage();
  toast(`انحفظت ${done} قطعة بالدفتر`); go('studio');
}

async function nxFreeSpace() {                    // sold-out items keep only their cover photo
  const C = CUR || calc(); const sold = C.items.filter(it => it.status === 'مباعة' && (it.img0 || (it.imgs || []).length));
  if (!sold.length || !nxAssets) { toast('ما في صور قطع مباعة لتنمسح'); return; }
  NX.busy = 'save'; let freed = 0, k = 0; render();
  for (const it of sold) {
    nxSetProg(k++ / sold.length, `عم فضّي مساحة… ${k} من ${sold.length}`);
    const x = await nxItemx(it.id); const imgs = x ? x.imgs || [] : it.imgs || [];

    if (imgs.length <= 1 && !pr && !(x && (x.info || (x.more || []).length))) continue;

    if (pr) { try { await nxAssets.delete(pr); freed++; } catch (e) {} }
    for (const a of [x && x.info, ...((x && x.more) || [])].filter(Boolean)) { try { await nxAssets.delete(a); freed++; } catch (e) {} }
    if (x) { const { proof, info, more, ...rest } = x; await nxSetItemx(it.id, { ...rest, imgs: imgs.slice(0, 1) }); }
  }
  NX.busy = ''; nxUsage(); toast(`انمسحت ${freed} صورة من قطع مباعة — الغلاف بيضل`); render();
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-nx]'); if (!t) return;
  const a = t.dataset.nx, d = NX.drafts[t.dataset.d];
  if (a === 'pic') { const i = +t.dataset.i; NX.sel = NX.sel && NX.sel.d === t.dataset.d && NX.sel.i === i ? null : { d: t.dataset.d, i }; render(); return; }

    const cur = NX.drafts[NX.sel.d]; if (!cur) { NX.sel = null; render(); return; }
    const mine = nxMine(), idx = mine.indexOf(cur), img = (cur.imgs || [])[NX.sel.i]; if (!img) return;
    const rest = cur.imgs.filter(x => x !== img);
    if (a === 'mv-cover') await nxSaveDraft(cur, { imgs: [img, ...rest] });
    else if (a === 'mv-del') { await nxSaveDraft(cur, { imgs: rest, n: rest.length }); if (nxAssets) try { await nxAssets.delete(img); } catch (err) {} }
    else if (a === 'mv-prev' || a === 'mv-next') {
      const tg = mine[idx + (a === 'mv-prev' ? -1 : 1)];
      if (!tg || nxSt(tg) === 'up') { toast('استنّى لتخلص صور القطعة التانية ترتفع'); return; }
      await nxSaveDraft(cur, { imgs: rest, n: rest.length });
      const ti = a === 'mv-prev' ? [...(tg.imgs || []), img] : [img, ...(tg.imgs || [])];
      await nxSaveDraft(tg, { imgs: ti, n: ti.length });
    } else if (a === 'mv-new') {
      await nxSaveDraft(cur, { imgs: rest, n: rest.length });
      const id = 'd' + newId().replace('-', '');
      const nd = { id, cartonId: cur.cartonId, seq: (cur.seq || 0) + 0.5, st: nxCanSee() ? 'wait' : 'manual', imgs: [img], n: 1, qty: '1', grade: 'A', demand: 'عادي', name: '', category: '', storeCat: 'home', marketPrice: '', priceNote: '', brand: '', ian: '', desc: '', f1: '', n1: '', f2: '', n2: '', f3: '', channel: 'مزاد تنافسي', store: false, at: Date.now() };
      await nxSaveDraft(nd, {}); if (nd.st === 'wait') { NX.queue.push(id); nxRun(); }
    }
    if (!(cur.imgs || []).length) await nxDropDraft(cur, false);
    NX.sel = null; render(); return;
  }
  if (a === 'gdel' && d) { if (!t.classList.contains('armed')) { t.classList.add('armed'); toast('اكبس كمان مرة لتشيل القطعة وصورها'); return; } await nxDropDraft(d, true); render(); return; }
  if (a === 'retry' && d) { NX.queue.push(d.id); d.st = 'wait'; nxRun(); render(); return; }
  if (a === 'resume') { nxMine().forEach(x => { const s = nxSt(x); if ((s === 'wait' || s === 'up') && NX.local[x.id] || s === 'wait') if (!NX.queue.includes(x.id)) NX.queue.push(x.id); }); NX.stop = false; nxRun(); render(); return; }
  if (a === 'clear') {
    if (!t.classList.contains('armed')) { t.classList.add('armed'); t.lastChild.textContent = 'أكّد: امسح كل يلي بالانتظار مع صوره'; return; }
    NX.stop = true; NX.queue = []; const all = nxMine(); NX.busy = 'save';
    for (let k = 0; k < all.length; k++) { nxSetProg(k / all.length, `عم امسح… ${k + 1} من ${all.length}`); await nxDropDraft(all[k], true); }
    Object.values(NX.local).flat().forEach(p => p && p.url && URL.revokeObjectURL(p.url));
    NX.busy = ''; NX.err = ''; NX.sel = null; NX.stop = false; nxUsage(); render(); return;
  }
  if (a === 'regroup') {
    if (!nxCanSee()) { NX.err = nxSample ? nxNoImgMsg : 'Claude مش متاح بهالعرض.'; render(); return; }
    if (!t.classList.contains('armed')) { t.classList.add('armed'); t.lastChild.textContent = 'أكّد: رتّب من جديد (التعديلات بالكروت بتروح)'; return; }
    await nxRegroup(); return;
  }
  if (a === 'reload') { location.reload(); return; }
  if (a === 'allow') {
    try { const pm = await window.claude.use('permissions'); if (pm) { const r = await pm.request(['sample']); NX.perm = (r && r.sample) || await pm.state('sample'); } } catch (e) {}
    await nxSampleRetry();
    NX.err = NX.perm === 'denied' ? 'الإذن لـClaude مرفوض لهالصفحة. افتح قائمة الأذونات (Permissions) تبع الصفحة واسمح لـClaude، وبعدين كبّس «حمّل من جديد».' : nxSample && NX.perm === 'granted' ? '' : NX.err;
    if (nxSample && NX.perm === 'granted') toast('Claude صار واصل — كبّس «رتّب وخلّي Claude يقرا»');

    if (readOnly) return; const C = CUR || calc();
    const L = C.items.filter(it => (!NX.studioCarton || it.cartonId === NX.studioCarton) && it.sortStatus !== 'تالفة' && (it.img0 || (it.imgs || []).length) && it.grade !== 'A' && it.grade !== 'N' && S.items[it.id]);
    if (!L.length) return;
    if (!t.classList.contains('armed')) { t.classList.add('armed'); t.textContent = 'أكّد: ' + L.length + ' قطعة كرتونتها بتصير سليمة'; return; }
    const next = { ...S.items }; L.forEach(it => { next[it.id] = { ...S.items[it.id], grade: 'A' }; }); S.items = next; render();
    if (!demo) for (const it of L) await writeRec('items', it.id, next[it.id]);
    toast(L.length + ' قطعة صارت «من جوّا جديدة، والكرتونة سليمة»'); return;
  }
  if (a === 'pitchall') { if (NX.pitching) { NX.pitchStop = true; return; } const C = CUR || calc(); nxPitchAll(C.items.filter(it => (!NX.studioCarton || it.cartonId === NX.studioCarton) && it.sortStatus !== 'تالفة' && (it.img0 || (it.imgs || []).length))); return; }

  if (a === 'filter') { NX.filter = t.dataset.v; NX.show = 40; render(); return; }

});

    + `<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Alexandria:wght@600;700&family=Archivo:wght@700;800&display=swap">`
    + `<style>${css}\n:root,:root:not([data-theme="light"]){--bg:#fff!important;--surface:#fff!important;--surface2:#F3F5F9!important;--ink:#0F1D3A!important;--ink2:#3A4660!important;--muted:#687390!important;--line:#E1E5EE!important;--line2:#CBD2DF!important;--acc-text:#C4480A!important;color-scheme:light!important}.logo-l{display:block!important}.logo-d{display:none!important}body{background:#fff;padding:24px}.invdoc{max-width:760px;margin:0 auto;box-shadow:none;border:0}@page{margin:12mm}</style>`
    + `</head><body>${c.outerHTML}<script>window.onload=function(){setTimeout(function(){window.print()},400)}<\/script></body></html>`;
  saveFile((en ? 'invoice-' : 'فاتورة-') + UI.invCust + '-' + today() + '.html', html, 'text/html');
  toast(en ? 'Printable invoice downloaded — open it to print' : 'نزلت الفاتورة للطباعة — افتحها وبتنطبع');
}
async function saveFile(filename, data, type) {
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) {}
  if (!dl) {
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type })); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('نزل الملف'); }
    catch (e) { toast('ما زبط التنزيل'); }
    return;
  }
  try { const r = await dl.save({ filename, data: new Blob([data], { type }) }); if (r.status === 'saved') toast('نزل الملف'); }
  catch (e) { if (e.code !== 'declined') toast('ما زبط التنزيل'); }
}
function exportCSV(name) {
  const t = TBL[name]; if (!t || !t.rows.length) { toast('ما في شي للتصدير'); return; }
  const tmp = document.createElement('div');
  const txt = h => { tmp.innerHTML = h; return tmp.textContent.trim(); };
  const cols = t.cols.filter(c => c.h);
  const cell = (c, r) => { let h = c.cell ? c.cell(r) : c.v(r); if (c.cell) { const m = /<select[\s\S]*?<\/select>/.exec(h); if (m) { const s = /<option[^>]*selected[^>]*>([^<]*)/.exec(m[0]); return s ? s[1] : ''; } } return txt(h); };
  const q = s => /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  const lines = [cols.map(c => q(tr(txt(c.h)))).join(','), ...t.rows.map(r => cols.map(c => q(tr(cell(c, r)))).join(','))];
  saveFile((TITLES[UI.tab] || name) + '-' + today() + '.csv', '﻿' + lines.join('\r\n'), 'text/csv');
}

  const d = $('#drawer');
  d.innerHTML = `<div class="scrim" data-x="close"></div><form class="panel" id="pfrm"><header><div><h2>الشركاء ونسب الربح</h2><div class="sub">النسبتين لازم يجمعوا 100%</div></div><button type="button" class="btn icon ghost" data-x="close">${ico('x')}</button></header><div class="pbody"><div class="fgrid">
    <div class="fsec">الشريك الأول</div><div class="fld"><label for="p0">الاسم</label><input id="p0" value="${esc(settings.p0)}"></div><div class="fld"><label for="s0">النسبة من الربح (%)</label><input id="s0" type="number" step="any" dir="ltr" style="text-align:right" value="${r2(n(settings.s0)*100)}"></div>
    <div class="fsec">الشريك الثاني</div><div class="fld"><label for="p1">الاسم</label><input id="p1" value="${esc(settings.p1)}"></div><div class="fld"><label for="s1">النسبة من الربح (%)</label><input id="s1" type="number" step="any" dir="ltr" style="text-align:right" value="${r2(n(settings.s1)*100)}"></div>
    <div class="calc"><div style="grid-column:1/-1">مش شرط يكونوا متساويين — وشريك العمل بياخد نصيبه حتى لو ما حط كاش.</div></div></div></div><div class="err" id="perr"></div>
    <footer><div></div><div class="r"><button type="button" class="btn" data-x="close">إلغاء</button><button class="btn pri">${ico('check')}حفظ</button></div></footer></form>`;
  d.hidden = false;
  d.addEventListener('click', e => { if (e.target.closest('[data-x="close"]')) closeDrawer(); });
  $('#pfrm').addEventListener('submit', async e => { e.preventDefault(); const s0 = n($('#s0').value)/100, s1 = n($('#s1').value)/100;
    if (Math.abs(s0 + s1 - 1) > 0.001) { $('#perr').textContent = 'المجموع هلق ' + pct(s0+s1) + ' — لازم يكون 100%'; return; }
    const p0 = $('#p0').value.trim() || 'أنا', p1 = $('#p1').value.trim() || 'الشريك';
    closeDrawer(); await saveSettings({ p0, p1, s0, s1 }); toast('انحفظ'); });
}
async function wipeAll() {
  COLLS.forEach(c => S[c] = {}); settings = { ...DEF_SETTINGS };
  if (mode === 'db') {
    try {
      for (const c of COLLS) { const snap = await db.collection(c).get(); for (const d of snap.docs) await enqueue(c + '/' + d.id, () => db.doc(c + '/' + d.id).delete()); }
      await enqueue('settings/main', () => db.doc('settings/main').set({ ...DEF_SETTINGS }));
    } catch (e) { fail(e); }
  } else saveLocal();
  UI.invCust = ''; render(); toast('انمسحت كل البيانات — التطبيق فاضي');
}
function doImport(file) {
  const fr = new FileReader();
  fr.onload = async () => {
    let d; try { d = JSON.parse(fr.result); } catch (e) { toast('الملف مش نسخة احتياطية صالحة'); return; }
    if (!d || d.app !== 'nasib-ledger' || !d.S) { toast('الملف مش نسخة احتياطية من هالدفتر'); return; }
    let count = 0;
    for (const c of COLLS) for (const [id, rec] of Object.entries(d.S[c] || {})) { S[c][id] = rec; count++; }
    settings = { ...DEF_SETTINGS, ...(d.settings || {}) }; render();
    if (mode === 'db') {
      for (const c of COLLS) {
        const groups = {}; for (const [id, rec] of Object.entries(d.S[c] || {})) (groups[bucket(id)] ||= {})[id] = rec;
        for (const [b, r] of Object.entries(groups)) await enqueue(c + '/b' + b, async () => { const ref = db.doc(c + '/b' + b); const s = await ref.get(); const cur = s.exists ? (s.data().r || {}) : {}; await ref.set({ r: { ...cur, ...r } }); }).catch(fail);
      }
      await enqueue('settings/main', () => db.doc('settings/main').set({ ...settings })).catch(fail);
    } else saveLocal();
    toast('استرجعت ' + count + ' سجل');
  };
  fr.readAsText(file);
}
