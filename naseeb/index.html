<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface2:#EEF1F6; --ink:#0F1D3A; --ink2:#3A4660; --muted:#687390; --line:#E1E5EE; --line2:#CBD2DF;
  --acc:#FF6A1A; --acc-ink:#0F1D3A; --acc-soft:#FFE7D9; --acc-hover:#F25C0C; --acc-text:#C4480A;
  --s1:#0F1D3A; --s2:#FF6A1A;
  --good:#16774F; --good-soft:#E2F2EA; --warn:#9E5F06; --warn-soft:#FBEFD8; --bad:#B0372A; --bad-soft:#F9E3DF; --info:#2A5C8A; --info-soft:#E3ECF5; --neu-soft:#EDF0F5;
  --side:#0F1D3A; --side-ink:#B4BED3; --side-strong:#FFFFFF; --side-hover:#18284A; --side-active:#213558; --side-line:#1B2A4A; --side-muted:#7F8BA8;
  --shadow-sm:0 1px 2px rgba(15,29,58,.06);
  --shadow:0 1px 2px rgba(15,29,58,.06),0 10px 30px -8px rgba(15,29,58,.16);
  --r:10px;
  --f:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --fh:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --fn:"Archivo","IBM Plex Sans Arabic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#081226; --surface:#0F1D3A; --surface2:#15254A; --ink:#EEF1F6; --ink2:#C3CBDB; --muted:#8C97B0; --line:#1E2E52; --line2:#2C3E66;
    --acc:#FF6A1A; --acc-ink:#0F1D3A; --acc-soft:#3A2415; --acc-hover:#FF7F3A; --acc-text:#FF8A4C;
    --s1:#DDE2EB; --s2:#FF6A1A;
    --good:#4DC195; --good-soft:#12302A; --warn:#E3A84D; --warn-soft:#35290F; --bad:#EC7E71; --bad-soft:#3A1E1A; --info:#86B3DE; --info-soft:#172838; --neu-soft:#16254A;
    --side:#060E1E; --side-hover:#0F1B35; --side-active:#172A4F; --side-line:#122040;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -8px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#081226; --surface:#0F1D3A; --surface2:#15254A; --ink:#EEF1F6; --ink2:#C3CBDB; --muted:#8C97B0; --line:#1E2E52; --line2:#2C3E66;
  --acc:#FF6A1A; --acc-ink:#0F1D3A; --acc-soft:#3A2415; --acc-hover:#FF7F3A; --acc-text:#FF8A4C;
  --s1:#DDE2EB; --s2:#FF6A1A;
  --good:#4DC195; --good-soft:#12302A; --warn:#E3A84D; --warn-soft:#35290F; --bad:#EC7E71; --bad-soft:#3A1E1A; --info:#86B3DE; --info-soft:#172838; --neu-soft:#16254A;
  --side:#060E1E; --side-hover:#0F1B35; --side-active:#172A4F; --side-line:#122040;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -8px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.55;direction:rtl;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tn{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding-block:calc(18px + env(safe-area-inset-top,0px)) 14px}
.side-brand{display:flex;align-items:center;gap:11px;padding:0 20px 18px;border-bottom:1px solid var(--side-line)}
.mark{width:36px;height:36px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:#fff;flex:none;position:relative}
.mark svg{width:20px;height:20px}
.brand-mark{height:36px;width:auto;display:block;flex:none}
.brand-txt{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.brand-word{height:26px;width:auto;display:block}
.top-brand{display:none}
.top-mark{height:26px;width:auto}
.logo-d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:block}}
:root[data-theme="dark"] .logo-l{display:none} :root[data-theme="dark"] .logo-d{display:block}
.side-brand b{display:block;color:var(--side-strong);font-weight:600;font-size:15px;letter-spacing:-.005em}
.side-brand small{display:block;color:var(--side-muted);font-size:11.5px;margin-top:-1px}
.nav{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.nav-h{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--side-muted);padding:14px 10px 6px}
.nav-h:first-child{padding-top:2px}
.nav-h.big{font-size:12.5px;letter-spacing:0;color:var(--side-strong);margin-top:8px;padding-top:14px;border-top:1px solid var(--side-line)}
.nav-h.big:first-child{margin-top:0;padding-top:2px;border-top:0}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--side-ink);padding:8px 10px;border-radius:8px;text-align:right;font-weight:500;font-size:13.5px}
.nav button:hover{background:var(--side-hover);color:var(--side-strong)}
.nav button.on{background:var(--side-active);color:var(--side-strong)}
.nav button.on .ico{color:#FF6A1A}
.nav button.on{box-shadow:inset 3px 0 0 #FF6A1A}
html:not([data-lang="en"]) .nav button.on{box-shadow:inset -3px 0 0 #FF6A1A}
.nav .cnt{margin-inline-start:auto;background:#FF6A1A;color:#0F1D3A;font-size:11px;font-weight:700;border-radius:10px;padding:0 7px;line-height:18px}
.side-foot{padding:12px 20px 0;border-top:1px solid var(--side-line);font-size:12px;color:var(--side-muted);display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:#4DC195;flex:none}
.dot.off{background:#FF6A1A}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:8;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-inline:28px;padding-block:calc(12px + env(safe-area-inset-top,0px)) 12px;display:flex;align-items:center;gap:12px}
.btn.menu-btn{display:none}
.gsearch{position:relative;flex:1;max-width:420px}
.gsearch .ico{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px}
.gsearch input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 36px 8px 12px;font-size:13.5px}
.gsearch input::placeholder{color:var(--muted)}
.gres{position:absolute;top:calc(100% + 6px);right:0;left:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:9;max-height:360px;overflow:auto}
.gres button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:8px 10px;border-radius:7px;text-align:right}
.gres button:hover,.gres button.hl{background:var(--surface2)}
.gres small{color:var(--muted);margin-inline-start:auto;font-size:12px}
.gres .none{padding:10px;color:var(--muted);font-size:13px}
.top-act{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.newmenu{position:relative}
.dd{position:absolute;top:calc(100% + 6px);left:0;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:9}
.dd button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:7px;text-align:right;font-size:13.5px}
.dd button:hover{background:var(--surface2)}
.dd .ico{color:var(--muted);width:16px;height:16px}

.content{padding-inline:28px;padding-block:24px 64px;display:flex;flex-direction:column;gap:20px;max-width:1360px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{font-family:var(--fh);font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.ph p{margin:3px 0 0;color:var(--muted);font-size:13.5px;max-width:72ch}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface);padding:7px 13px;border-radius:8px;font-weight:500;font-size:13.5px;white-space:nowrap;box-shadow:var(--shadow-sm);line-height:1.4}
.btn:hover{background:var(--surface2)}
.btn .ico{width:16px;height:16px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.btn.pri:hover{background:var(--acc-hover)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--bad);border-color:var(--line2)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.icon{padding:7px}
.btn.sm{padding:4px 10px;font-size:12.5px}

/* ---------- banners ---------- */
.banner{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);font-size:13px;border:1px solid}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.banner.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 22%,transparent)}
.banner span{display:flex;align-items:center;gap:8px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 0}
.card-h h2{font-size:14px;font-weight:600;margin:0}
.card-h .sub{color:var(--muted);font-size:12.5px}
.card-b{padding:14px 18px 18px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}

.kpi{padding:16px 18px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .lbl{color:var(--muted);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .val{font-family:var(--fn);font-size:26px;font-weight:800;letter-spacing:-.015em;direction:ltr;text-align:right;unicode-bidi:isolate;line-height:1.3;margin-top:4px}
.kpi .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-top:6px}
.kpi .spark{width:84px;height:28px;flex:none}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px}
.t-good{background:var(--good-soft);color:var(--good)} .t-warn{background:var(--warn-soft);color:var(--warn)} .t-bad{background:var(--bad-soft);color:var(--bad)} .t-info{background:var(--info-soft);color:var(--info)} .t-neu{background:var(--neu-soft);color:var(--muted)}

/* chart */
.chart{position:relative;padding:8px 0 0}
.plot{position:relative;height:210px;margin-inline-start:44px;display:flex;align-items:flex-end;gap:10px;border-bottom:1px solid var(--line2)}
.gl{position:absolute;right:0;left:0;border-top:1px dashed var(--line);pointer-events:none}
.gl span{position:absolute;right:calc(100% + 8px);top:-9px;font-size:11px;color:var(--muted);direction:ltr;white-space:nowrap}
.bcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;cursor:default}
.bcol:hover{background:color-mix(in srgb,var(--surface2) 70%,transparent)}
.bstack{width:min(34px,70%);display:flex;flex-direction:column-reverse;gap:2px}
.bstack i{display:block;min-height:0}
.bstack i.a{background:var(--s1)} .bstack i.b{background:var(--s2)}
.bstack i:last-child{border-radius:4px 4px 0 0}
.xl{display:flex;gap:10px;margin-inline-start:44px;padding-top:6px}
.xl span{flex:1;text-align:center;font-size:11px;color:var(--muted);direction:ltr}
.xl span.now{color:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.tip{position:absolute;z-index:3;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 11px;font-size:12px;pointer-events:none;box-shadow:var(--shadow);white-space:nowrap;transform:translate(50%,-100%)}
.tip b{display:block;font-size:12.5px;margin-bottom:3px}
.tip div{display:flex;justify-content:space-between;gap:14px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:5px}

/* attention list */
.alist{display:flex;flex-direction:column}
.aitem{display:flex;align-items:center;gap:12px;padding:11px 18px;border-top:1px solid var(--line);border-inline:0;border-bottom:0;background:none;width:100%;text-align:right}
.aitem:first-child{border-top:0}
.aitem:hover{background:var(--surface2)}
.aico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.aico .ico{width:16px;height:16px}
.aitem .t{flex:1;min-width:0}
.aitem .t b{display:block;font-weight:500;font-size:13.5px}
.aitem .t small{color:var(--muted);font-size:12px}
.aitem .v{font-weight:600;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.aitem .chev{color:var(--muted);width:14px;height:14px}
.allgood{padding:26px 18px;text-align:center;color:var(--muted);font-size:13px}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.row:first-child{border-top:0}
.row span{color:var(--ink2)}
.row b{font-weight:600;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.row.sum{border-top:1.5px solid var(--ink);margin-top:2px}
.row.sum span{color:var(--ink);font-weight:600}
.row.neg b{color:var(--muted)}
.row.link{cursor:pointer} .row.link:hover span{color:var(--acc-text)}

.seg{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:var(--surface2)}
.seg i{display:block;height:100%}
.seglg{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:12px;font-size:12.5px}
.seglg div{display:flex;align-items:center;gap:7px;color:var(--ink2)}
.seglg b{margin-inline-start:auto;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.seglg i{width:9px;height:9px;border-radius:2px;flex:none}

.rec{display:flex;flex-direction:column;gap:14px}
.rec-i{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;cursor:pointer}
.rec-i .code{grid-row:span 2}
.rec-i .nm{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-i .pc{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr}
.prog{grid-column:2/4;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);border-radius:3px}
.prog i.done{background:var(--good)}

/* ---------- table ---------- */
.tcard{overflow:hidden}
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.field{position:relative}
.field .ico{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.field input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 32px 6px 10px;width:230px;max-width:100%;font-size:13px}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;max-width:100%}
.tbar .grow{flex:1}
.tbar .count{color:var(--muted);font-size:12.5px}
.segc{display:inline-flex;background:var(--surface2);border-radius:8px;padding:3px;gap:2px}
.segc button{border:0;background:none;padding:4px 11px;border-radius:6px;color:var(--muted);font-weight:500;font-size:13px}
.segc button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:13px;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.chip i{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.on i{color:inherit;opacity:.75}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:right;font-weight:500;color:var(--muted);padding:9px 14px;white-space:nowrap;font-size:12px;background:var(--surface2);border-bottom:1px solid var(--line)}
td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:color-mix(in srgb,var(--surface2) 75%,transparent)}
td.m,th.m{direction:ltr;text-align:right}
td.neg{color:var(--bad)} td.pos{color:var(--good)} td.dim{color:var(--muted)}
td.strong{font-weight:600}
tfoot td{font-weight:600;background:var(--surface2);border-top:1px solid var(--line2);border-bottom:0}
.empty{padding:48px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .eico{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.empty b{color:var(--ink);font-weight:600;font-size:14.5px}
.empty p{margin:0;max-width:44ch;font-size:13px}

.code{font-family:var(--mono);font-size:12px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);padding:1px 6px;border-radius:5px;direction:ltr;display:inline-block;line-height:1.5}
.st{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 10px;border-radius:999px;font-size:12px;font-weight:500;line-height:1.6}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.cell-sel{border:1px solid var(--line);border-radius:7px;padding:3px 8px;background:var(--surface);font-size:12.5px}
.cell-sel.fx{border-color:var(--acc);font-weight:600}
.cell-sel.unset{border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:var(--warn-soft);color:var(--warn)}
.mini-prog{display:inline-block;width:64px;height:5px;border-radius:3px;background:var(--surface2);vertical-align:middle;margin-inline-start:8px;overflow:hidden}
.mini-prog i{display:block;height:100%;background:var(--acc)}

/* ---------- invoice ---------- */
.inv-wrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.invdoc{padding:32px 34px}
.inv-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line)}
.inv-top{align-items:center}
.inv-brand{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.inv-logo{height:96px;width:auto}
.inv-tag{color:var(--muted);font-size:12px}
.inv-top h2{font-family:var(--fh)}
.inv-top h2::after{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--acc);margin:8px auto 0 0}
html[data-lang="en"] .inv-top h2::after{margin:8px 0 0 auto}
.inv-to b.inv-due{font-family:var(--fn);font-weight:800;font-size:26px;direction:ltr;unicode-bidi:isolate;color:var(--acc-text)}
.inv-tot .row.sum b{font-family:var(--fn);font-weight:800}
.inv-top .brandline b{font-size:16px;font-weight:600}
.inv-top h2{font-size:24px;margin:0;font-weight:600;letter-spacing:-.01em;text-align:left}
.inv-meta{display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.inv-meta b{color:var(--ink);font-weight:500;direction:ltr;text-align:left}
.inv-to{display:flex;justify-content:space-between;gap:16px;padding:20px 0;flex-wrap:wrap}
.inv-to small{display:block;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.05em;margin-bottom:4px}
.inv-to b{font-size:15px;font-weight:600}
.inv-to div{font-size:13px;color:var(--ink2)}
.invdoc table th{background:none;border-bottom:1.5px solid var(--ink);color:var(--ink2);padding-inline:8px}
.invdoc table td{padding-inline:8px}
.inv-tot{margin-top:18px;margin-inline-start:auto;width:min(300px,100%)}
.inv-tot .row.sum b{font-size:18px}
.inv-note{margin-top:26px;padding-top:16px;border-top:1px dashed var(--line2);font-size:12.5px;color:var(--ink2)}
.inv-note p{margin:3px 0 0}
.tel{unicode-bidi:isolate;direction:ltr;display:inline-block}
.inv-note .inv-cur{color:var(--muted);font-size:11.5px;margin-top:8px}
.inv-slogan{display:inline-block;font-family:var(--fh);font-weight:700;font-size:16px;color:var(--ink);margin-bottom:6px;padding-inline-start:10px;border-inline-start:4px solid var(--acc)}

/* ---------- drawer ---------- */
#drawer{position:fixed;inset:0;z-index:20}
.scrim{position:absolute;inset:0;background:rgba(8,14,12,.42)}
.panel{position:absolute;top:0;bottom:0;left:0;width:min(520px,100%);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;border-right:1px solid var(--line)}
.panel header{padding:calc(18px + env(safe-area-inset-top,0px)) 22px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.panel header h2{font-size:17px;font-weight:600;margin:0}
.panel header .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.pbody{flex:1;overflow-y:auto;padding:18px 22px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12.5px;color:var(--ink2);font-weight:500}
.fld label em{color:var(--bad);font-style:normal}
.fld input,.fld select,.fld textarea{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:8px 11px;width:100%;font-size:13.5px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-soft)}
.fld textarea{min-height:72px;resize:vertical}
.fld .hint{font-size:12px;color:var(--muted)}
.fsec{grid-column:1/-1;font-size:11.5px;font-weight:600;letter-spacing:.05em;color:var(--muted);padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.fsec:first-child{border-top:0;padding-top:0;margin-top:0}
.calc{grid-column:1/-1;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.calc div{display:flex;flex-direction:column;font-size:12px;color:var(--muted)}
.calc b{color:var(--ink);font-size:15px;font-weight:600;direction:ltr;text-align:right;unicode-bidi:isolate}
.calc .warnline{grid-column:1/-1;color:var(--bad);font-size:12.5px;font-weight:500}
.err{color:var(--bad);font-size:12.5px;padding:0 22px 8px}
.panel footer{padding:14px 22px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.panel footer .r{display:flex;gap:8px}

#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:24px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13px;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 48px);display:flex;align-items:center;gap:8px}
.bnav{display:none}
.side-scrim{display:none}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;font-size:13.5px;color:var(--ink2)}
.steps li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:7px;background:var(--acc-soft);color:var(--acc-text);font-weight:600;display:grid;place-items:center;font-size:12.5px}
.steps b{color:var(--ink);font-weight:600}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pcard{padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,box-shadow .15s}
.pcard:hover{border-color:var(--line2)}
.pcard.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.pc-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pc-sup{color:var(--muted);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-lbl{color:var(--muted);font-size:12.5px;font-weight:500}
.pc-big{font-size:30px;font-weight:600;letter-spacing:-.015em;direction:ltr;unicode-bidi:isolate;line-height:1.25;color:var(--ink);font-variant-numeric:tabular-nums;font-family:var(--fn);font-weight:800}
.pc-big.lv-good{color:var(--good)} .pc-big.lv-mid{color:var(--warn)} .pc-big.lv-bad{color:var(--bad)}
.pc-bigrow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pc-of{color:var(--ink2);font-size:13px}
.pc-lblrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pc-warn.bad{color:var(--bad);background:var(--bad-soft)}
.row b small{unicode-bidi:isolate;direction:rtl;font-weight:500;font-size:11.5px;margin-inline-start:4px} .row b small.pos{color:var(--good)} .row b small.dim{color:var(--muted)}
.pc-f{font-size:12.5px;color:var(--ink2);margin-top:2px}
.pc-f::before{content:'';}
.pc-f span{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.pcard .rows{margin-top:12px}
.pcard .row{padding:6px 0;font-size:13px}
.pc-warn{margin-top:8px;font-size:12px;font-weight:500;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:4px 8px}
a.lnk{color:var(--acc-text);text-decoration:none;font-weight:500;white-space:nowrap}
a.lnk:hover{text-decoration:underline}
.slist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow.on{background:var(--acc-soft)}
.srow .t b{display:block;font-weight:500;font-size:13px}
.srow .t small,.srow .amt small{color:var(--muted);font-size:11.5px}
.srow .amt{text-align:left;direction:ltr;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.srow .amt small{direction:rtl}
@media (max-width:560px){.srow{grid-template-columns:minmax(0,1fr) auto}.srow select{grid-column:1/-1}}
.inv-del{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px;padding:10px 12px;border:1px dashed var(--line2);border-radius:9px;font-size:13px;color:var(--ink2)}
.inv-other{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.inv-share{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.inv-other input{width:72px;border:1px solid var(--line2);border-radius:7px;padding:4px 8px;background:var(--surface);font-size:13px}
@media print{
  :root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#fff!important;--surface:#fff!important;--surface2:#F3F5F9!important;--ink:#0F1D3A!important;--ink2:#3A4660!important;--muted:#687390!important;--line:#E1E5EE!important;--line2:#CBD2DF!important;--acc-text:#C4480A!important;color-scheme:light!important}
  body{background:#fff!important}
  body *{visibility:hidden}
  .invdoc,.invdoc *{visibility:visible}
  .invdoc{position:absolute;inset:0 0 auto 0;border:0!important;box-shadow:none!important;padding:4px 12px!important}
  .inv-del,.inv-actions,.banner,#toast{display:none!important}
  .logo-l{display:block!important}.logo-d{display:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{margin:12mm}
}
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.inv-wrap{grid-template-columns:minmax(0,1fr)}}
@media (max-width:980px){.g21,.g11{grid-template-columns:1fr}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .main,.content{min-width:0;overflow-x:clip}
  .side{visibility:hidden}
  .shell.open .side{visibility:visible}
  .side{position:fixed;top:0;bottom:0;right:0;width:272px;z-index:25;transform:translateX(100%);transition:transform .22s ease}
  .shell.open .side{transform:none;box-shadow:var(--shadow)}
  .shell.open .side-scrim{display:block}
  .side-scrim{display:none;position:fixed;inset:0;background:rgba(8,14,12,.42);z-index:24}
  .btn.menu-btn{display:inline-flex}
  .top-brand{display:flex;align-items:center}
  .topbar{padding-inline:16px}
  .content{padding-inline:16px;padding-block:18px 96px}
  .top-act .lbl{display:none}
  .bnav{display:flex;position:fixed;bottom:0;right:0;left:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;font-size:11px;color:var(--muted);position:relative}
  .bnav button.on{color:var(--acc-text)}
  .bnav .cnt{position:absolute;top:4px;left:calc(50% - 20px);background:#FF6A1A;color:#0F1D3A;font-size:10px;font-weight:700;border-radius:8px;padding:0 5px;line-height:15px}
  #toast{left:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:560px){
  .g4,.g3{grid-template-columns:1fr}
  .kpi .val{font-size:23px}
  .fgrid{grid-template-columns:1fr}
  .gsearch{max-width:none}
  .invdoc{padding:20px 18px}
  .field input{width:100%}
  .field{flex:1 1 100%}
  .plot,.xl{margin-inline-start:38px;gap:5px}
}
@media (prefers-reduced-motion:no-preference){.panel{animation:slide .2s ease-out}@keyframes slide{from{transform:translateX(-24px);opacity:.4}to{transform:none;opacity:1}}}
/* ---------- English (LTR) ---------- */
html[data-lang="en"] body{direction:ltr}
html[data-lang="en"] th{text-align:left}
html[data-lang="en"] td.m,html[data-lang="en"] th.m{text-align:right}
html[data-lang="en"] .nav button,html[data-lang="en"] .gres button,html[data-lang="en"] .dd button,html[data-lang="en"] .aitem{text-align:left}
html[data-lang="en"] .kpi .val,html[data-lang="en"] .calc b{text-align:left}
html[data-lang="en"] .srow .amt{text-align:right}
html[data-lang="en"] .row b small,html[data-lang="en"] .srow .amt small{direction:ltr}
html[data-lang="en"] .gsearch .ico{right:auto;left:11px}

html[data-lang="en"] .inv-top h2{text-align:right}
html[data-lang="en"] .inv-to > div:last-child{text-align:right!important}

.langbtn{font-weight:600;min-width:52px;justify-content:center}
@media (max-width:560px){.langbtn{min-width:0;padding:7px 8px}}
@media (max-width:900px){
  html[data-lang="en"] .side{right:auto;left:0;transform:translateX(-100%)}
  html[data-lang="en"] .shell.open .side{transform:none}
  html[data-lang="en"] #toast{right:16px}
}
@media (prefers-reduced-motion:no-preference){html[data-lang="en"] .panel{animation:slideR .2s ease-out}@keyframes slideR{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}}

/* ---------- استقبال الكرتونة + البوستات ---------- */

.nx-drop b{color:var(--ink);font-size:15px}

.nx-prog .bar i{display:block;height:100%;background:var(--acc);transition:width .3s}

.nx-mv{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}

const GRADES = [['A','من جوّا جديدة، والكرتونة سليمة'],['T','من جوّا جديدة، والكرتونة مخزوقة'],['B','مفتوحة وممتازة'],['C','فيها توك بسيط'],['D','فيها عيب واضح']];
const GRADE_F = { N: 1, A: 1, T: 1, B: 0.85, C: 0.7, D: 0.5 };
const DEMANDS = ['سريع','عادي','بطيء'];
const DEMAND_F = { 'سريع': 1.15, 'عادي': 1, 'بطيء': 0.85 };
const itemFactor = it => (GRADE_F[it.grade] || 1) * (DEMAND_F[it.demand] || 1);
// round up to a clean auction price: .5 under $10, $1 under $50, $5 above
const niceUp = p => p <= 0 ? 0 : p < 10 ? Math.max(0.5, Math.ceil(p * 2 - 1e-9) / 2) : p < 50 ? Math.ceil(p - 1e-9) : Math.ceil(p / 5 - 1e-9) * 5;

/* ============ calculations (mirror of the Excel formulas) ============ */
function calc() {
  const m = n(settings.margin);
  const lateDays = n(settings.lateDays);
  const td = today();
  // orders meta
  const meta = S.orders;
  // sales base
  const salesArr = Object.entries(S.sales).map(([id, s]) => {
    const cust = (s.customer || '').trim();
    const we = weekEnd(s.date);
    const key = orderKey(cust, we);
    const om = meta[key] || {};
    const orderStatus = om.deliveryStatus || '';
    let ret = '';
    if (s.override === '-') ret = '';
    else if (s.override === 'مرتجعة' || s.override === 'مرتجعة تالفة' || s.override === 'ملغاة') ret = s.override;
    else if (orderStatus === 'مرتجعة' || orderStatus === 'ملغاة') ret = orderStatus;
    let state;
    if (ret === 'مرتجعة') state = 'returned';
    else if (ret === 'ملغاة') state = 'cancelled';
    else if (ret === 'مرتجعة تالفة') state = 'retdmg';
    else if (orderStatus === 'وصلت' || (orderStatus === 'مرتجعة' && s.override === '-')) state = 'delivered';
    else state = 'reserved';
    const qty = n(s.qty), total = r2(qty * n(s.unitPrice));
    return { id, ...s, customer: cust, qty, total, weekEnd: we, key, orderStatus, ret, state, live: !ret };
  }).sort((a,b) => (a.date||'').localeCompare(b.date||'') || a.id.localeCompare(b.id));
  salesArr.forEach((s,i) => s.no = i + 1);

  // orders grouping
  const og = {};
  salesArr.forEach(s => {
    if (!s.customer || !s.weekEnd) return;
    const o = og[s.key] || (og[s.key] = { key: s.key, customer: s.customer, weekEnd: s.weekEnd, qty: 0, due: 0, lines: 0, first: s.date });
    o.lines++;
    if (s.live) { o.qty += s.qty; o.due = r2(o.due + s.total); }
  });
  const orders = Object.values(og).sort((a,b) => a.weekEnd.localeCompare(b.weekEnd) || a.first.localeCompare(b.first) || a.customer.localeCompare(b.customer));
  orders.forEach((o,i) => {
    const mm = meta[o.key] || {};
    Object.assign(o, { no: i+1, deliveryMethod: mm.deliveryMethod||'', area: mm.area||'', payStatus: mm.payStatus||'', collected: n(mm.collected), deliveryDate: mm.deliveryDate||'', deliveryStatus: mm.deliveryStatus||'', deposit: n(mm.deposit), depositMethod: mm.depositMethod||'' });
    const coll = o.deliveryMethod === 'استلام من المحل' ? o.collected : 0;
    o.remaining = r2(o.due - coll - o.deposit);
    const isD = o.deliveryMethod === 'دليفري';
    o.deliveryFee = isD && o.deliveryStatus !== 'ملغاة' ? (mm.deliveryFee == null || mm.deliveryFee === '' ? (n(settings.deliveryFee) || 4) : n(mm.deliveryFee)) : 0;          // paid by the customer on top, kept by the courier
    o.owes = isD ? r2(Math.max(0, o.due - o.deposit)) : 0; // what the courier must hand back to us
    o.custPays = isD ? r2(o.due + o.deliveryFee - o.deposit) : o.remaining;
    o.stmt = mm.stmt && S.dpay[mm.stmt] ? mm.stmt : '';
    const dl = addDays(o.weekEnd, lateDays);
    o.late = (!CLOSED.includes(o.deliveryStatus) && td > dl) || (o.deliveryDate && o.deliveryDate > dl);
  });
  // one delivery = one fee: a customer's orders that go out together (all still-open ones,
  // or ones delivered on the same day) are charged a single fee, set on the latest order
  const batches = {};
  orders.forEach(o => { if (o.deliveryMethod !== 'دليفري' || o.deliveryStatus === 'ملغاة') return;
    const done = o.deliveryStatus === 'وصلت' || o.deliveryStatus === 'مرتجعة';
    (batches[o.customer + '|' + (done ? (o.deliveryDate || o.weekEnd) : 'open')] ||= []).push(o); });
  Object.values(batches).forEach(g => { if (g.length < 2) return; const fee = g[g.length - 1].deliveryFee;
    g.forEach((o, i) => { o.deliveryFee = i === g.length - 1 ? fee : 0; o.custPays = r2(o.due + o.deliveryFee - o.deposit); }); });
  const orderByKey = {}; orders.forEach(o => orderByKey[o.key] = o);
  salesArr.forEach(s => { const o = orderByKey[s.key]; s.orderNo = o ? o.no : ''; });

  // items aggregates
  const itemsMap = {};
  Object.entries(S.items).forEach(([id, it]) => {
    const qty = n(it.qty), dmgBase = it.sortStatus === 'تالفة' ? qty : 0;
    itemsMap[id] = { id, ...it, qty, dmgBase, reserved: 0, delivered: 0, retDmg: 0, revenue: 0, marketPrice: n(it.marketPrice) };
  });
  salesArr.forEach(s => {
    const it = itemsMap[s.itemId]; s.itemName = it ? it.name : '(محذوفة)'; s.itemCode = it ? it.code : '';
    if (!it) return;
    if (s.state === 'reserved') it.reserved += s.qty;
    else if (s.state === 'delivered') it.delivered += s.qty;
    else if (s.state === 'retdmg') it.retDmg += s.qty;
    if (s.live) it.revenue = r2(it.revenue + s.total);
  });
  const items = Object.values(itemsMap);
  items.forEach(it => {
    it.damaged = Math.min(it.qty, it.dmgBase + it.retDmg);
    it.sold = it.reserved + it.delivered;
    it.available = Math.max(0, it.qty - it.damaged - it.sold);
    it.sellable = Math.max(0, it.qty - it.damaged);
    it.status = it.damaged >= it.qty && it.qty > 0 ? 'تالفة' : it.available > 0 ? 'متاحة' : it.reserved > 0 ? 'محجوزة' : it.sold > 0 ? 'مباعة' : 'متاحة';
    it.refValue = r2(it.marketPrice * it.qty);
  });

  // cartons
  const cartonsMap = {};
  Object.entries(S.cartons).forEach(([id, c]) => {
    const purchase = c.method === 'بمبلغ إجمالي' ? n(c.lump) : c.method === 'بالقطعة' ? n(c.pieceCount) * n(c.piecePrice) : n(c.weight) * n(c.kgPrice);
    cartonsMap[id] = { id, ...c, purchase: r2(purchase), total: r2(purchase + n(c.extra)), qty: 0, damaged: 0, delivered: 0, reserved: 0, available: 0, sellable: 0, collected: 0, sellVal: 0, allPriced: true, items: [] };
  });
  items.forEach(it => {
    const c = cartonsMap[it.cartonId]; it.cartonCode = c ? c.code : '—';
    if (!c) return;
    c.items.push(it);
    c.qty += it.qty; c.damaged += it.damaged; c.delivered += it.delivered; c.reserved += it.reserved; c.available += it.available; c.sellable += it.sellable;
    c.collected = r2(c.collected + it.revenue);
    if (it.sellable > 0) { if (it.marketPrice > 0) c.sellVal += it.marketPrice * it.sellable; else c.allPriced = false; }
  });
  const cartons = Object.values(cartonsMap).sort((a,b) => (a.date||'').localeCompare(b.date||'') || (a.code||'').localeCompare(b.code||''));
  // ===== Pricing by market value (per carton) =====
  //   target        = carton cost × (1 + margin)
  //   market value  = Σ highest-online-price × good pieces still available
  //                   (unpriced pieces are estimated at the carton's average priced piece)
  //   ratio         = (target − sold so far) ÷ (expected sell-through × market value)
  //                   → "we sell at X% of market price"; never below settings.minRatio
  //   item price    = ratio × its market price × (grade × demand factor, normalised so the carton total stays the same)
  //                   rounded up to a clean auction number, never above its market price
  // Everything is recomputed after each sale. Profit/COGS uses the plain average: cost ÷ good pieces.
  const baseRate = Math.min(1, Math.max(0.05, n(settings.sellThrough) || 0.8));
  const floorR = settings.minRatio == null || settings.minRatio === '' ? 0.25 : Math.max(0, n(settings.minRatio));
  cartons.forEach(c => {
    c.avgUnit = c.sellable > 0 ? c.total / c.sellable : 0;
    c.avgRaw = c.qty > 0 ? c.total / c.qty : 0;
    c.remainingCost = r2(c.total - c.collected);
    c.target = r2(c.total * (1 + m));
    c.remainingTarget = r2(Math.max(0, c.target - c.collected));
    c.costNow = c.available > 0 ? Math.max(0, c.total - c.collected) / c.available : 0;
    c.recovery = c.total > 0 ? Math.min(1, c.collected / c.total) : 0;
    c.sellRate = n(c.sellThrough) > 0 ? Math.min(1, Math.max(0.05, n(c.sellThrough) / 100)) : baseRate;
    c.sellRateCustom = n(c.sellThrough) > 0;
    const av = c.items.filter(it => it.available > 0);
    const priced = av.filter(it => it.marketPrice > 0);
    const pQty = priced.reduce((a, it) => a + it.available, 0);
    const uQty = av.reduce((a, it) => a + it.available, 0) - pQty;
    c.unpriced = av.length - priced.length;
    c.mvPriced = priced.reduce((a, it) => a + it.marketPrice * it.available, 0);
    c.mvEst = pQty > 0 ? (c.mvPriced / pQty) * uQty : 0;
    c.marketValue = r2(c.mvPriced + c.mvEst);
    c.uniform = c.available > 0 ? c.remainingTarget / c.available : 0; // fallback when nothing is priced yet
    c.needRatio = c.marketValue > 0 ? c.remainingTarget / (c.sellRate * c.marketValue) : null;
    c.ratio = c.needRatio == null ? null : Math.max(c.needRatio, floorR);
    c.atFloor = c.needRatio != null && c.needRatio < floorR;
    c.level = c.ratio == null ? '' : c.ratio <= 0.5 ? 'good' : c.ratio <= 0.7 ? 'mid' : 'bad';
    const fBar = c.mvPriced > 0 ? priced.reduce((a, it) => a + it.marketPrice * it.available * itemFactor(it), 0) / c.mvPriced : 1;
    c.listValue = 0;
    c.items.forEach(it => {
      it.avgUnit = c.avgUnit;
      it.unitUsed = c.avgUnit;
      it.cogs = it.avgUnit * it.sold;
      it.profitA = it.revenue - it.cogs;
      it.costNow = c.costNow;
      it.costDone = c.remainingCost <= 0.004;
      it.invValue = it.avgUnit * it.available;
      it.factor = itemFactor(it);
      if (c.ratio != null && it.marketPrice > 0) {
        it.suggested = Math.min(it.marketPrice, niceUp(c.ratio * it.marketPrice * it.factor / (fBar || 1)));
        it.ratioEff = it.suggested / it.marketPrice; it.priceMode = 'market';
      } else if (c.ratio == null) { it.suggested = c.uniform ? niceUp(c.uniform) : 0; it.ratioEff = null; it.priceMode = 'avg'; }
      else { it.suggested = null; it.ratioEff = null; it.priceMode = 'pending'; }
      if (it.available > 0 && it.suggested) c.listValue += it.suggested * it.available;
    });
    c.expected = r2(c.collected + c.sellRate * c.listValue);
    c.expectedProfit = c.total > 0 ? (c.expected - c.total) / c.total : 0;
  });
  items.forEach(it => { if (it.avgUnit == null) { it.avgUnit = 0; it.unitUsed = 0; it.cogs = 0; it.invValue = 0; it.profitA = it.revenue; it.suggested = null; it.costNow = 0; it.priceMode = 'pending'; } });
  items.sort((a,b) => (a.code||'').localeCompare(b.code||'', undefined, {numeric:true}));

  // customers
  const custMap = {};
  Object.entries(S.customers).forEach(([id, c]) => custMap[(c.name||'').trim()] = { id, ...c, name: (c.name||'').trim(), orders: 0, buys: 0, spend: 0 });
  salesArr.forEach(s => { if (!s.customer) return; const c = custMap[s.customer] || (custMap[s.customer] = { id: null, name: s.customer, phone:'', address:'', notes:'', orders:0, buys:0, spend:0 }); if (s.live) { c.buys++; c.spend = r2(c.spend + s.total); } else { c.backouts = (c.backouts || 0) + 1; if (s.ret === 'ملغاة') c.cancels = (c.cancels || 0) + 1; else c.returns = (c.returns || 0) + 1; } c.lines = (c.lines || 0) + 1; });
  orders.forEach(o => { const c = custMap[o.customer]; if (c && o.due > 0) c.orders++; });
  const customers = Object.values(custMap).sort((a,b) => b.spend - a.spend || a.name.localeCompare(b.name));
  customers.forEach(c => { c.avg = c.orders ? c.spend / c.orders : 0; c.repeat = c.orders > 1; c.backouts = c.backouts || 0; c.cancels = c.cancels || 0; c.returns = c.returns || 0; c.unreliable = c.backouts >= 2 && c.backouts / (c.lines || 1) >= 0.25; });

  // delivery — the courier sends a statement (كشف) listing delivered orders and pays their value;
  // the delivery fee is added to the customer's invoice and stays with the courier (never our revenue or cost)
  const dpay = Object.entries(S.dpay).map(([id,p]) => ({ id, ...p, amount: n(p.amount), commission: n(p.commission), orders: Array.isArray(p.orders) ? p.orders : null })).sort((a,b) => (a.date||'').localeCompare(b.date||'') || a.id.localeCompare(b.id));
  const dOrders = orders.filter(o => o.deliveryMethod === 'دليفري' && o.deliveryStatus !== 'ملغاة');
  const isDone = o => o.deliveryStatus === 'وصلت' || o.deliveryStatus === 'مرتجعة';
  dOrders.forEach(o => { o.settled = o.stmt ? 'stmt' : ''; });
  // a payment without an order list ("دفعة على الحساب") settles the oldest delivered orders first
  let pool = dpay.filter(p => !p.orders).reduce((a,p) => a + p.amount + p.commission, 0);
  dOrders.filter(o => !o.settled && isDone(o) && o.owes > 0.004).forEach(o => { if (pool >= o.owes - 0.01) { o.settled = 'pool'; pool = r2(pool - o.owes); } });
  dOrders.forEach(o => { if (!o.settled && isDone(o) && o.owes <= 0.004) o.settled = 'zero'; o.remaining = o.settled ? 0 : o.owes; });
  dpay.forEach((p,i) => { p.no = i + 1; if (p.orders) { const os = p.orders.map(k => orderByKey[k]).filter(Boolean); p.count = os.length; p.expectedNow = r2(os.reduce((a,o) => a + o.owes, 0)); p.fees = r2(os.reduce((a,o) => a + (o.deliveryStatus === 'وصلت' ? o.deliveryFee : 0), 0)); p.diff = r2(p.amount + p.commission - p.expectedNow); } });
  const stNoById = {}; dpay.forEach(p => stNoById[p.id] = p.no); dOrders.forEach(o => { o.stmtNo = o.stmt ? stNoById[o.stmt] || '' : ''; });
  const dOwed = r2(dOrders.filter(isDone).reduce((a,o) => a + o.owes, 0));
  const dWith = dOrders.filter(o => o.deliveryStatus === 'بعهدة الدليفري' && !o.settled);
  const dPendingCourier = r2(dWith.reduce((a,o) => a + o.owes, 0));
  const dUnsettled = dOrders.filter(o => isDone(o) && !o.settled && o.owes > 0.004);
  const dPaid = r2(dpay.reduce((a,p) => a + p.amount, 0));
  const dComm = r2(dpay.reduce((a,p) => a + p.commission, 0));
  const dBalance = r2(dOwed - dPaid - dComm);
  const dFees = r2(dOrders.filter(o => o.deliveryStatus === 'وصلت').reduce((a,o) => a + o.deliveryFee, 0));
  const dShort = r2(dpay.filter(p => p.orders).reduce((a,p) => a + Math.min(0, p.diff), 0));

  // cash
  const moves = Object.entries(S.moves).map(([id,x]) => ({ id, ...x, amount: n(x.amount) })).sort((a,b) => (a.date||'').localeCompare(b.date||''));
  const expenses = Object.entries(S.expenses).map(([id,x]) => ({ id, ...x, amount: n(x.amount) })).sort((a,b) => (a.date||'').localeCompare(b.date||''));
  const sumMoves = (t, p) => moves.filter(x => x.type === t && (p == null || String(x.partner) === String(p))).reduce((a,x) => a + x.amount, 0);
  const netCapital = r2(sumMoves('إيداع') - sumMoves('سحب رأس مال'));   // cash put in by the partners
  const pickupCollected = r2(orders.filter(o => o.deliveryMethod === 'استلام من المحل').reduce((a,o) => a + o.collected, 0));
  const deposits = r2(orders.reduce((a,o) => a + o.deposit, 0));
  // a carton can be bought with partnership cash, or brought in by one partner as goods (capital in kind)
  const fundOf = c => c.fundedBy === '0' || c.fundedBy === '1' ? c.fundedBy : '';
  const cartonCost = r2(cartons.reduce((a,c) => a + c.total, 0));
  const cartonCostCash = r2(cartons.filter(c => !fundOf(c)).reduce((a,c) => a + c.total, 0));
  const inKind = i => r2(cartons.filter(c => fundOf(c) === String(i)).reduce((a,c) => a + c.total, 0));
  // an expense is paid from the box, or by one partner out of pocket (owed back to him before profits are split)
  const payerOf = x => { const v = (x.paidBy || '').trim(); if (!v || v === 'الصندوق') return ''; if (v === '0' || v === '1') return v;
    if (v === (settings.p0 || 'أنا')) return '0'; if (v === (settings.p1 || 'الشريك')) return '1'; if (v === 'أنا' || v === 'الشريك الأول') return '0'; return '1'; };
  expenses.forEach(x => x.payer = payerOf(x));
  const expTotal = r2(expenses.reduce((a,x) => a + x.amount, 0));
  const expCash = r2(expenses.filter(x => !x.payer).reduce((a,x) => a + x.amount, 0));
  const expBy = i => r2(expenses.filter(x => x.payer === String(i)).reduce((a,x) => a + x.amount, 0));
  const profitWithdrawn = r2(sumMoves('سحب أرباح'));
  const reimbursed = r2(sumMoves('استرداد مصاريف'));
  const cash = r2(netCapital + pickupCollected + deposits + dPaid - dComm - cartonCostCash - expCash - profitWithdrawn - reimbursed);

  const revenue = r2(salesArr.filter(s => s.live).reduce((a,s) => a + s.total, 0));
  const revComp = r2(salesArr.filter(s => s.live && s.auction === 'مزاد تنافسي').reduce((a,s) => a + s.total, 0));
  const revFixed = r2(revenue - revComp);
  const cogs = items.reduce((a,it) => a + (it.cogs||0), 0);
  const grossProfit = r2(revenue - cogs);
  const profit = r2(grossProfit - expTotal);   // net: every expense comes off before the split
  const invValue = r2(items.reduce((a,it) => a + (it.invValue||0), 0));
  const totQty = items.reduce((a,it) => a + it.qty, 0);
  const totDelivered = items.reduce((a,it) => a + it.delivered, 0);
  const totReserved = items.reduce((a,it) => a + it.reserved, 0);
  const totDamaged = items.reduce((a,it) => a + it.damaged, 0);
  const sellThrough = (totQty - totDamaged) > 0 ? (totDelivered + totReserved) / (totQty - totDamaged) : 0;
  const pickupUncollected = r2(orders.filter(o => o.deliveryMethod === 'استلام من المحل' && o.deliveryStatus !== 'مرتجعة').reduce((a,o) => a + Math.max(0, o.remaining), 0));

  const partners = [0,1].map(i => {
    const share = n(settings['s'+i]);
    const cashIn = sumMoves('إيداع', i) - sumMoves('سحب رأس مال', i), goods = inKind(i);
    const cut = profit * share, took = sumMoves('سحب أرباح', i);
    const paidExp = expBy(i), backExp = sumMoves('استرداد مصاريف', i), owedExp = r2(paidExp - backExp);
    return { i, name: settings['p'+i] || ('شريك ' + (i+1)), share, cashIn, goods, capital: r2(cashIn + goods), cut, took, paidExp, backExp, owedExp, left: r2(cut - took + owedExp) };
  });

  // weekly series (last 8 weeks, Sun–Sat)
  const curWE = weekEnd(td);
  const weeks = []; for (let k = 7; k >= 0; k--) weeks.push({ we: addDays(curWE, -7 * k), comp: 0, fixed: 0, profit: 0, count: 0 });
  const wIdx = {}; weeks.forEach((w, i) => wIdx[w.we] = i);
  salesArr.forEach(s => { if (!s.live) return; const i = wIdx[s.weekEnd]; if (i == null) return; const w = weeks[i];
    if (s.auction === 'مزاد تنافسي') w.comp += s.total; else w.fixed += s.total; w.count++;
    const it = itemsMap[s.itemId]; w.profit += s.total - (it && it.unitUsed ? it.unitUsed * s.qty : 0); });
  weeks.forEach(w => { w.total = r2(w.comp + w.fixed); w.profit = r2(w.profit); });

  const T = {
    cartonsCount: cartons.length, cartonCost, totQty, totDelivered, totReserved, totDamaged, sellThrough,
    revComp, revFixed, revenue, profit, margin: revenue > 0 ? profit / revenue : 0,
    repeat: customers.filter(c => c.repeat).length, ordersCount: orders.length,
    noStatus: orders.filter(o => !o.deliveryStatus).length,
    withCourier: orders.filter(o => o.deliveryStatus === 'بعهدة الدليفري').length,
    returned: orders.filter(o => o.deliveryStatus === 'مرتجعة').length,
    cancelled: orders.filter(o => o.deliveryStatus === 'ملغاة').length,
    late: orders.filter(o => o.late).length,
    pickupUncollected, dOwed, dPaid, dComm, dBalance, dPendingCourier, dFees, dShort, dWithCount: dWith.length, dUnsettledCount: dUnsettled.length, dUnsettledAmt: r2(dUnsettled.reduce((a,o) => a + o.owes, 0)),
    toRecover: r2(cartonCost - revenue), invValue,
    netCapital, pickupCollected, deposits, expTotal, expCash, profitWithdrawn, reimbursed, cash, net: r2(cash + invValue), grossProfit, cartonCostCash, inKindTotal: r2(inKind(0) + inKind(1)),
  };
  return { weeks, sales: salesArr, orders, orderByKey, items, itemsMap, cartons, cartonsMap, customers, dpay, dOrders, moves, expenses, partners, T };
}

/* ============ storage ============ */
const queues = {};
function enqueue(path, fn) { const p = (queues[path] || Promise.resolve()).then(fn, fn); queues[path] = p.catch(() => {}); return p; }
function fail(e) {
  const code = e && e.code;
  if (code === 'invalid_argument') { readOnly = true; toast('ما عندك صلاحية تعدّل — الصفحة للقراءة بس'); render(); }
  else if (code === 'quota_exceeded') toast('وصل التخزين للحد الأقصى — نزّل نسخة احتياطية واحذف بيانات قديمة');
  else toast('ما انحفظ التعديل — جرّب كمان مرة');
}
async function writeRec(coll, id, rec) {
  if (mode !== 'db') { saveLocal(); return; }
  const path = coll + '/b' + bucket(id);
  return enqueue(path, async () => {
    const ref = db.doc(path);
    try { await ref.update({ r: { [id]: rec } }); }
    catch (e) {
      if (e && e.code === 'invalid_argument') {
        const snap = await ref.get().catch(() => null);
        if (snap && snap.exists) throw e;
        await ref.set({ r: { [id]: rec } });
      } else if (e && e.code === 'unavailable') {
        await new Promise(r => setTimeout(r, 400 + Math.random()*600));
        await ref.update({ r: { [id]: rec } }).catch(async e2 => { if (e2.code === 'invalid_argument') await ref.set({ r: { [id]: rec } }); else throw e2; });
      } else throw e;
    }
  }).catch(fail);
}
async function put(coll, id, rec) {
  S[coll] = { ...S[coll], [id]: rec }; render();
  if (demo) return;
  await writeRec(coll, id, rec);
}
async function del(coll, id) {
  const next = { ...S[coll] }; delete next[id]; S[coll] = next; render();
  if (demo) return;
  await writeRec(coll, id, { _del: true });
}
async function saveSettings(ns) {
  settings = { ...settings, ...ns }; render();
  if (demo) return;
  if (mode === 'db') enqueue('settings/main', () => db.doc('settings/main').set({ ...settings })).catch(fail);
  else saveLocal();
}
function saveLocal() { if (demo) return; try { localStorage.setItem(LSKEY, JSON.stringify({ S, settings })); } catch (e) {} }
function loadLocal() { try { const d = JSON.parse(localStorage.getItem(LSKEY) || 'null'); if (d) { COLLS.forEach(c => S[c] = d.S?.[c] || {}); settings = { ...DEF_SETTINGS, ...(d.settings||{}) }; } } catch (e) {} }

let rq = false;
function scheduleRender() { if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; render(); }); }

async function init() {
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (db) {
    mode = 'db';
    let pending = COLLS.length + 1;
    const done = () => { if (pending > 0 && --pending === 0) render(); };
    COLLS.forEach(c => {
      db.collection(c).onSnapshot(snap => {
        const m = {};
        snap.docs.forEach(d => { const r = (d.data() || {}).r || {}; for (const k in r) if (r[k] && !r[k]._del) m[k] = r[k]; });
        if (!demo) { S[c] = m; scheduleRender(); } else saved && (saved.S[c] = m);
        done();
      }, e => { toast('انقطع الاتصال بالبيانات — حدّث الصفحة'); done(); });
    });
    db.doc('settings/main').onSnapshot(s => { const d = s.exists ? s.data() : {}; const ns = { ...DEF_SETTINGS, ...d }; if (!demo) { settings = ns; scheduleRender(); } else saved && (saved.settings = ns); done(); }, () => done());
    setTimeout(() => { if (pending > 0) { pending = 0; render(); } }, 6000);
  } else { mode = 'local'; loadLocal(); render(); }
}

    <section class="card kpi"><span class="lbl">صافي الربح</span><span class="val" style="color:${T.profit < 0 ? 'var(--bad)' : 'var(--ink)'}">${money(T.profit)}</span><div class="foot"><span>بعد مصاريف ${money(T.expTotal)}</span>${spark(W.map(w => w.profit), 'var(--s1)')}</div></section>
    <section class="card kpi"><span class="lbl">الرصيد الحالي بالصندوق</span><span class="val">${money(T.cash)}</span><div class="foot"><span>مع المخزون: <b style="color:var(--ink);direction:ltr;unicode-bidi:isolate">${money(T.net)}</b></span></div></section>
    <section class="card kpi"><span class="lbl">المتبقي لاسترداد التكلفة</span><span class="val">${money(Math.max(0, T.toRecover))}</span><div class="foot" style="flex-direction:column;align-items:stretch;gap:6px"><span>${T.toRecover > 0 ? `مسترد ${pct(recPct)} من تكلفة الكراتين` : `<span class="tag t-good">رجعت التكلفة</span> وربح فوقها ${money(-T.toRecover)}`}</span><div class="prog" style="grid-column:auto"><i class="${recPct >= 1 ? 'done' : ''}" style="width:${recPct*100}%"></i></div></div></section>
  </div>
  <div class="grid g21">
    <section class="card"><div class="card-h"><div><h2>الإيرادات الأسبوعية</h2><div class="sub">آخر 8 أسابيع · الأسبوع بينتهي السبت</div></div><div class="legend"><span><i style="background:var(--s1)"></i>مزاد تنافسي</span><span><i style="background:var(--s2)"></i>كمية ثابتة</span></div></div>
      <div class="card-b"><div class="chart" id="wchart"><div class="plot">${grid}${cols}</div><div class="xl">${xl}</div><div class="tip" id="wtip" hidden></div></div></div></section>
    <section class="card"><div class="card-h"><h2>بحاجة لانتباهك</h2>${att.length ? `<span class="tag t-warn">${att.length}</span>` : ''}</div>
      <div style="padding-top:8px">${att.length ? `<div class="alist">${att.map(a => `<button class="aitem" data-act="jump" data-to="${a[5]}"><span class="aico ${a[1]}">${ico(a[0])}</span><span class="t"><b>${a[2]}</b><small>${a[3]}</small></span><span class="v">${a[4]}</span>${ico('chev','chev')}</button>`).join('')}</div>` : `<div class="allgood">${ico('check')}<div>كل شي تمام — ما في شي معلّق.</div></div>`}</div></section>
  </div>
  <div class="grid g3">
    <section class="card"><div class="card-h"><h2>المخزون</h2><span class="sub">${T.totQty} قطعة بـ${T.cartonsCount} كرتونة</span></div><div class="card-b">
      <div class="seg">${T.totQty ? segs.filter(s => s[1] > 0).map(s => `<i style="flex:${s[1]};background:${s[2]}" title="${s[0]}: ${s[1]}"></i>`).join('') : ''}</div>
      <div class="seglg">${segs.map(s => `<div><i style="background:${s[2]}"></i>${s[0]}<b>${s[1]}</b></div>`).join('')}</div>
      <div class="rows" style="margin-top:12px">${row('نسبة التصريف', pct(T.sellThrough))}${row('قيمة المخزون بالتكلفة', money(T.invValue))}${row('إجمالي تكلفة الكراتين', money(T.cartonCost), '', 'cartons')}</div></div></section>
    <section class="card"><div class="card-h"><h2>الطلبيات</h2><span class="sub">${T.ordersCount} طلبية</span></div><div class="card-b"><div class="rows">
      ${row('بلا حالة تسليم', T.noStatus, '', 'orders')}${row('بعهدة الدليفري', T.withCourier)}${row('مرتجعة (كليًا أو جزئيًا)', T.returned)}${row('ملغاة قبل الشحن', T.cancelled)}${row('متأخرة', T.late)}${row('زبائن متكررين', T.repeat, '', 'customers')}${row('إيرادات تنافسي / ثابت', money(T.revComp) + ' · ' + money(T.revFixed))}</div></div></section>
    <section class="card"><div class="card-h"><h2>فلوس برّا الصندوق</h2></div><div class="card-b"><div class="rows">
      ${row('رصيد عند الدليفري', money(T.dBalance), '', 'delivery')}${row('طلبيات لسا مع الدليفري', money(T.dPendingCourier))}${row('غير محصّل (استلام من المحل)', money(T.pickupUncollected), '', 'orders')}${row('عرابين مستلمة', money(T.deposits))}${row('هامش الربح المستهدف', pct(n(settings.margin)), '', 'settings')}</div></div></section>
  </div>
  <div class="grid g11">
    <section class="card"><div class="card-h"><h2>استرداد تكلفة الكراتين</h2><button class="btn sm ghost" data-act="goto" data-tab="cartons">الكل ${ico('chev')}</button></div><div class="card-b">
      ${recent.length ? `<div class="rec">${recent.map(c => `<div class="rec-i" data-act="edit-cartons" data-id="${c.id}">${code(c.code)}<span class="nm">${esc(c.supplier || c.method)} · ${money(c.collected)} من ${money(c.total)}</span><span class="pc">${pct(c.recovery)}</span><div class="prog"><i class="${c.recovery >= 1 ? 'done' : ''}" style="width:${c.recovery*100}%"></i></div></div>`).join('')}</div>` : `<div class="allgood">ما في كراتين لهلق</div>`}</div></section>
    <section class="card"><div class="card-h"><h2>كيف بيتكوّن رصيد الصندوق</h2></div><div class="card-b"><div class="rows">
      ${row('رأس مال كاش من الشركاء', money(T.netCapital))}${row('+ محصّل نقدًا (استلام من المحل)', money(T.pickupCollected))}${row('+ عرابين تأكيد', money(T.deposits))}${row('+ دفعات الدليفري', money(T.dPaid))}
      ${row('− عمولة الدليفري', money(-T.dComm), 'neg')}${row('− كراتين مدفوعة من الصندوق', money(-T.cartonCostCash), 'neg')}${row('− مصاريف مدفوعة من الصندوق', money(-T.expCash), 'neg')}${row('− أرباح مسحوبة', money(-T.profitWithdrawn), 'neg')}${T.reimbursed ? row('− مصاريف رجّعناها للشركاء', money(-T.reimbursed), 'neg') : ''}
      ${row('الرصيد الحالي بالصندوق', money(T.cash), 'sum')}${row('+ قيمة المخزون (بضاعة، مش كاش)', money(T.invValue))}${row('صافي الوضع المالي التقريبي', money(T.net), 'sum')}</div></div></section>
  </div>
  <section class="card"><div class="card-h"><h2>توزيع الأرباح بين الشركاء</h2><button class="btn sm ghost" data-act="goto" data-tab="cash">الصندوق ${ico('chev')}</button></div><div style="padding-top:12px">${partnersTable(C, false)}</div></section>`;
};
function partnersTable(C, withCap) {
  return table('partners', [
    { h:'الشريك', v: p => `<b>${esc(p.name)}</b>` },
    ...(withCap ? [{ h:'رأس مالو', m:1, cell: p => `<td class="m">${money(p.capital)}${p.goods ? ` <small class="dim" dir="rtl" style="unicode-bidi:isolate">(منها بضاعة ${money(p.goods)})</small>` : ''}</td>` }] : []),
    { h:'النسبة', v: p => pct(p.share) }, { h:'حصته من الربح', m:1, cell: p => mcell(p.cut) },
    { h:'مصاريف دفعها وبترجعلو', m:1, cell: p => mcell(p.owedExp || null) },
    { h:'سحب أرباح', m:1, cell: p => mcell(p.took || null) }, { h:'المتبقي له', m:1, cell: p => mcell(p.left, p.left >= 0 ? 'pos strong' : 'strong') },
  ], C.partners);
}

V.cartons = C => ph('الكراتين', 'سجّل كل كرتونة فور الشراء — بالوزن أو بالقطعة. شريط الاسترداد بيعبّى مع كل عملية بيع لحد ما ترجع التكلفة.', addBtn('cartons','كرتونة جديدة')) +
  tcard('cartons', '', table('cartons', [
    { h:'رقم الكرتون', v: c => code(c.code) }, { h:'تاريخ الشراء', v: c => esc(c.date) }, { h:'المورد', v: c => esc(c.supplier) || '<span class="dim">—</span>' }, { h:'الطريقة', v: c => esc(c.method) }, { h:'التمويل', v: c => c.fundedBy === '0' || c.fundedBy === '1' ? `<span class="tag t-warn">بضاعة ${esc(settings['p' + c.fundedBy] || '')}</span>` : '<span class="dim">الصندوق</span>' },
    { h:'سعر الشراء', m:1, cell: c => mcell(c.purchase) }, { h:'إضافي', m:1, cell: c => mcell(n(c.extra) || null) }, { h:'إجمالي التكلفة', m:1, cell: c => mcell(c.total, 'strong') }, { h:'الحالة', v: c => esc(c.status) },
    { h:'القطع', v: c => c.qty }, { h:'متوسط كلفة القطعة الآن', m:1, cell: c => mcell(c.available ? c.costNow : null) }, { h:'المُحصَّل', m:1, cell: c => mcell(c.collected) },
    { h:'الاسترداد', v: c => `${pct(c.recovery)}<span class="mini-prog"><i style="width:${c.recovery*100}%"></i></span>` },
    { h:'المتبقي للاسترداد', m:1, cell: c => mcell(c.remainingCost, c.remainingCost < 0 ? 'pos' : '') },
    { h:'مباعة', v: c => c.delivered }, { h:'متبقية', v: c => c.available }, { h:'تالفة', v: c => c.damaged || '<span class="dim">0</span>' }, { h:'محجوزة', v: c => c.reserved || '<span class="dim">0</span>' },
    { h:'منبيع بـ (من سعر السوق)', v: c => !c.available ? '<span class="dim">—</span>' : c.ratio == null ? '<span class="dim">بانتظار التسعير</span>' : `<span class="tag ${LV[c.level]}">${pct0(Math.min(1, c.ratio))}</span>` },
  ], C.cartons, { act:'edit-cartons', icon:'cartons', emptyT:'ما في كراتين لهلق', empty:'سجّل أول كرتونة لتبلّش — السعر، الوزن أو عدد القطع، وأي مصاريف إضافية.', emptyBtn: addBtn('cartons','كرتونة جديدة') }), C.cartons.length + ' كرتونة');

V.items = C => {
  const q = UI.q.toLowerCase();
  const price = UI.itemView === 'price';
  const rows = C.items.filter(it => (!UI.carton || it.cartonId === UI.carton) && (!q || [it.code, it.name, it.category].some(x => (x||'').toLowerCase().includes(q))));
  const isUnpriced = i => i.available > 0 && !(i.marketPrice > 0);
  const nUnpriced = rows.filter(isUnpriced).length;
  // the sale type changes from the row itself; the intake rule only sets the starting value
  const chanCol = { h:'مسار البيع', cell: i => { const cur = i.channel || 'مزاد تنافسي'; return `<td data-stop="1">${readOnly ? esc(cur) : `<select class="cell-sel${cur === 'كمية ثابتة' ? ' fx' : ''}" data-act="ichan" data-id="${esc(i.id)}" aria-label="مسار البيع">${AUCTIONS.map(a => `<option value="${a}"${cur === a ? ' selected' : ''}>${a}</option>`).join('')}</select>`}</td>`; } };
  const bar = `${searchBox('q-items','ابحث برقم أو اسم الصنف')}<select class="sel" id="f-carton" data-act="fcarton"><option value="">كل الكراتين</option>${C.cartons.map(c => `<option value="${c.id}"${UI.carton === c.id ? ' selected' : ''}>${esc(c.code)}</option>`).join('')}</select>
    ${price ? `<button class="chip${UI.onlyUnpriced ? ' on' : ''}" data-act="unpricedonly">ناقصها سعر <i>${nUnpriced}</i></button>` : ''}
    <div class="segc"><button data-act="iview" data-v="stock" class="${!price ? 'on' : ''}">المخزون</button><button data-act="iview" data-v="price" class="${price ? 'on' : ''}">التسعير</button></div>`;
  const desc = !price ? 'افرز التالف أولًا، وسجّل كل قطعة أو مجموعة متطابقة بسطر واحد. المتاح والمحجوز والمباع بيتحدثوا لحالهم من المبيعات.' : `كل كرتونة بتنسعّر كنسبة من سعر السوق، محسوبة لتوصل لربح ${pct0(n(settings.margin))} حتى لو ما انباع غير ${pct0(n(settings.sellThrough) || 0.8)} من القطع. حالة القطعة والطلب عليها بيعلّوا أو بينزّلوا سعرها. كل شي بيتحدّث بعد كل بيعة.`;
  const opt = { act:'edit-items', icon:'items', emptyT: C.items.length ? 'ما في نتائج' : 'ما في قطع لهلق', empty: C.items.length ? 'جرّب كلمة بحث تانية.' : 'بعد ما تسجّل كرتونة، افرز قطعها هون.', emptyBtn: C.items.length ? '' : addBtn('items','قطعة جديدة') };
  if (!price) {
    const tbl = table('items', [
      { h:'رقم القطعة', v: i => code(i.code) }, { h:'الكرتون', v: i => code(i.cartonCode) }, { h:'اسم الصنف', v: i => `<b style="font-weight:500">${esc(i.name)}</b>` }, { h:'الفئة', v: i => esc(i.category) || '<span class="dim">—</span>' }, { h:'الدرجة', v: i => esc(i.grade) },
      { h:'الكمية', v: i => i.qty }, chanCol, { h:'الحالة', v: i => pill(i.status) },
      { h:'متاح', v: i => `<b>${i.available}</b>` }, { h:'محجوز', v: i => i.reserved || '<span class="dim">0</span>' }, { h:'مباع ومُسلَّم', v: i => i.delivered || '<span class="dim">0</span>' }, { h:'تالف', v: i => i.damaged || '<span class="dim">0</span>' },
    ], rows, opt);
    return ph('القطع والتسعير', desc, addBtn('items','قطعة جديدة')) + tcard('items', bar, tbl, rows.length + ' سطر');
  }
  // ---- pricing view ----
  const cards = C.cartons.filter(c => UI.carton ? c.id === UI.carton : c.available > 0);
  const mc = v => Math.abs(v - Math.round(v)) < 0.005 ? '$' + Math.round(v).toLocaleString('en-US') : money(v);
  const card = c => {
    const head = `<div class="pc-top">${code(c.code)}<span class="pc-sup">${esc(c.supplier || c.method || '')}</span><span class="tag ${c.available ? 't-info' : 't-neu'}">${c.available ? c.available + ' قطعة باقية' : 'خلصت'}</span></div>`;
    let main;
    if (!c.available) main = `<div class="pc-lbl">كل القطع انباعت</div>`;
    else if (c.ratio == null) main = `<div class="pc-lbl">سعر موحّد مؤقت للقطعة</div><div class="pc-big">${money(niceUp(c.uniform))}</div><div class="pc-f">القطع لسا مش مسعّرة أونلاين — (الهدف − انباع) ÷ القطع الباقية</div>`;
    else main = `<div class="pc-lbl pc-lblrow"><span>منبيع بـ</span><span class="tag ${LV[c.level]}">${c.remainingTarget <= 0.004 ? 'وصلت للهدف ✓' : c.atFloor ? 'الحد الأدنى' : LV_T[c.level]}</span></div><div class="pc-bigrow"><span class="pc-big lv-${c.level}">${pct0(Math.min(1, c.ratio))}</span><span class="pc-of">من سعر السوق</span></div>
      <div class="pc-f">باقي للهدف <span>${mc(c.remainingTarget)}</span> ÷ <span>${mc(c.sellRate * c.marketValue)}</span> (${pct0(c.sellRate)} من قيمة السوق)</div>
      ${c.needRatio > 1 ? `<div class="pc-warn bad">لتوصل للهدف بدك تبيع بـ${pct0(c.needRatio)} من سعر السوق — مش ممكن. سعّرنا عالسقف (سعر السوق)، والمتوقع ربح ${pct0(c.expectedProfit)}.</div>` : c.level === 'bad' ? `<div class="pc-warn bad">سعر عالي لمزاد — البيع ممكن يبطى. إذا علقت القطع، الأفضل تقبل ربح أقل بهالكرتونة.</div>` : ''}`;
    const rows = c.available ? row('كلفة الكرتونة', mc(c.total)) + row('قيمة الباقي بالسوق', mc(c.marketValue) + (c.mvEst > 0 ? '*' : ''))
      + row('نسبة البيع المتوقعة', pct0(c.sellRate) + (c.sellRateCustom ? '' : ' <small class="dim">افتراضي</small>'))
      + row('المتوقع تجمعو', `${mc(c.expected)} <small class="${c.expectedProfit >= n(settings.margin) - 0.005 ? 'pos' : 'dim'}">ربح ${pct0(c.expectedProfit)}</small>`)
      + row('متوسط الكلفة الآن', c.remainingCost <= 0.004 ? '<span class="tag t-good" style="white-space:nowrap" dir="rtl">رجعت الكلفة</span>' : money(c.costNow))
      : row('كلفة الكرتونة', mc(c.total)) + row('انباع', `${mc(c.collected)} <small class="${c.collected >= c.target ? 'pos' : 'dim'}">ربح ${pct0(c.total ? (c.collected - c.total) / c.total : 0)}</small>`);
    return `<section class="card pcard${UI.carton === c.id ? ' on' : ''}" data-act="pcarton" data-id="${c.id}">${head}${main}<div class="rows">${rows}</div>
      ${c.unpriced ? `<div class="pc-warn">${c.unpriced} صنف ناقصو سعر أونلاين${c.mvEst > 0 ? ' — *مقدّرين بمتوسط الباقي' : ''}</div>` : ''}</section>`;
  };
  const safeUrl = u => /^https?:\/\//i.test((u || '').trim()) ? u.trim() : '';
  const src = i => { const u = safeUrl(i.priceUrl); let host = ''; try { host = u ? new URL(u).hostname.replace(/^www\./, '') : ''; } catch (e) {}
    const label = esc(i.priceSrc || host); return u ? `<a class="lnk" href="${esc(u)}" target="_blank" rel="noopener" data-stop>${label || 'الرابط'} ↗</a>` : (label || '<span class="dim">—</span>'); };
  const DM = { 'سريع': 't-good', 'عادي': 't-neu', 'بطيء': 't-warn' };
  const rowsP = UI.onlyUnpriced ? rows.filter(isUnpriced) : rows;
  const tbl = table('items', [
    { h:'رقم القطعة', v: i => code(i.code) }, { h:'اسم الصنف', v: i => `<b style="font-weight:500">${esc(i.name)}</b>` }, { h:'الكرتون', v: i => code(i.cartonCode) },
    { h:'متاح', v: i => i.available ? `<b>${i.available}</b>` : '<span class="dim">0</span>' },
    { h:'الحالة', v: i => `<span class="code">${esc(i.grade || '—')}</span>` },
    { h:'الطلب', v: i => `<span class="tag ${DM[i.demand || 'عادي']}">${esc(i.demand || 'عادي')}</span>` },
    chanCol,
    { h:'أعلى سعر أونلاين', m:1, cell: i => i.marketPrice > 0 ? mcell(i.marketPrice) : `<td class="m">${isUnpriced(i) ? '<span class="st t-warn" dir="rtl">بانتظار التسعير</span>' : '<span class="dim">—</span>'}</td>` },
    { h:'المصدر', v: src },
    { h:'متوسط الكلفة الآن', m:1, cell: i => !i.available ? `<td class="m dim">—</td>` : i.costDone ? `<td class="m"><span class="tag t-good" dir="rtl">رجعت الكلفة</span></td>` : `<td class="m">${money(i.costNow)}</td>` },
    { h:'السعر المقترح', m:1, cell: i => !i.available || !i.suggested ? `<td class="m dim">—</td>` : `<td class="m strong">${money(i.suggested)}${i.ratioEff != null ? ` <small class="dim" style="font-weight:400">${pct0(i.ratioEff)}</small>` : ''}</td>` },
  ], rowsP, { ...opt, emptyT: UI.onlyUnpriced && rows.length ? 'كل القطع مسعّرة' : opt.emptyT });
  return ph('القطع والتسعير', desc, addBtn('items','قطعة جديدة'))
    + (cards.length ? `<div class="pgrid">${cards.map(card).join('')}</div>` : '')
    + tcard('items', bar, tbl, rowsP.length + ' سطر');
};

V.sales = C => {
  const q = UI.q.toLowerCase();
  const weeks = [...new Set(C.sales.map(s => s.weekEnd))].sort().reverse();
  const rows = C.sales.filter(s => (!UI.week || s.weekEnd === UI.week) && (!q || [s.customer, s.itemName, s.itemCode, s.notes].some(x => (x||'').toLowerCase().includes(q)))).slice().reverse();
  const tot = rows.filter(s => s.live).reduce((a,s) => a + s.total, 0);
  const bar = `${searchBox('q-sales','ابحث بالزبون أو الصنف')}<select class="sel" id="f-week" data-act="fweek"><option value="">كل الأسابيع</option>${weeks.map(w => `<option value="${w}"${UI.week === w ? ' selected' : ''}>أسبوع ${w}</option>`).join('')}</select>`;
  return ph('سجل المبيعات', 'كل عملية بيع سطر، يوم بيومه. الطلبية الأسبوعية بتنعمل لحالها (زبون + أسبوع)، وحالة الوصول والإرجاع بتنسحب منها.', addBtn('sales','عملية بيع')) +
  tcard('sales', bar, table('sales', [
